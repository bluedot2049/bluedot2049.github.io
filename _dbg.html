<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>紙燈籠預覽</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1c1814; color: #e9e0cc; font-family: "Noto Serif TC", serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,0.5)); }
    .bar input { flex: 1 1 200px; max-width: 360px; padding: 8px 10px; border: 1px solid #5a4e3e; border-radius: 6px; background: #2a241e; color: inherit; font: inherit; }
    .bar button { padding: 8px 12px; border: 1px solid #5a4e3e; border-radius: 6px; background: #2a241e; color: inherit; font: inherit; cursor: pointer; }
    .note { position: fixed; top: 12px; left: 16px; font-size: 13px; opacity: 0.6; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div class="note">拖曳轉、滾輪縮放。左邊是預設的玩家角色，比大小用</div>
  <div class="bar">
    <input id="text" value="這張畫的藍色，是先上了一層黃才蓋上去的">
    <button id="say">說</button>
    <button data-v="0">正面</button>
    <button data-v="1.57">側面</button>
    <button data-v="3.14">背面</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { Lantern } from './js/lantern.js';
    import { Character } from './js/character.js';
    import { sanitizeLook } from './js/looks.js';
    import { shadowTexture } from './js/textures.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1c1814);
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a3026, 1.6));
    const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
    sun.position.set(2, 4, 3);
    scene.add(sun);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 40), new THREE.MeshLambertMaterial({ color: 0x4a3f33 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const shadowTex = shadowTexture();
    const lantern = new Lantern(shadowTex);
    lantern.group.position.x = 0.35;
    scene.add(lantern.group);
    const character = new Character(shadowTex, sanitizeLook({}));
    character.group.position.x = -0.45;
    scene.add(character.group);

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
    let yaw = 0.3, pitch = 0.12, dist = 3.2;
    const params = new URLSearchParams(location.search);
    if (params.has('yaw')) yaw = +params.get('yaw');
    if (params.has('pitch')) pitch = +params.get('pitch');
    if (params.has('dist')) dist = +params.get('dist');
    function place() {
      const c = Math.cos(pitch);
      camera.position.set(Math.sin(yaw) * c * dist, 0.65 + Math.sin(pitch) * dist, Math.cos(yaw) * c * dist);
      camera.lookAt(0, 0.65, 0);
    }

    let drag = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      yaw -= (e.clientX - drag[0]) * 0.008;
      pitch = Math.max(-0.3, Math.min(1.3, pitch + (e.clientY - drag[1]) * 0.008));
      drag = [e.clientX, e.clientY];
    });
    addEventListener('pointerup', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => { dist = Math.max(1, Math.min(8, dist * (1 + e.deltaY * 0.001))); }, { passive: true });

    const input = document.getElementById('text');
    document.getElementById('say').onclick = () => lantern.say(input.value);
    input.onkeydown = (e) => { if (e.key === 'Enter') lantern.say(input.value); };
    for (const b of document.querySelectorAll('[data-v]')) b.onclick = () => { yaw = +b.dataset.v; pitch = 0.12; };
    if (params.has('say')) lantern.say(params.get('say'));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      lantern.update(dt); document.title = lantern.writeT.toFixed(2) + " " + lantern.chars.length + " " + lantern.fadeT.toFixed(2);
      character.update(dt, 0);
      place();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
