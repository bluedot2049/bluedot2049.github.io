<body>
  <!-- 共用圖示 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4.5 5.5c2.8-1 5.3-.6 7.5 1v13c-2.2-1.6-4.7-2-7.5-1z"/><path d="M19.5 5.5c-2.8-1-5.3-.6-7.5 1v13c2.2-1.6 4.7-2 7.5-1z"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M5 9h13l-3.5-3.5M19 15H6l3.5 3.5"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.2l4.3 3.5v-12L7.2 9.5z"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.2l4.3 3.5v-12L7.2 9.5z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
      <symbol id="i-emote" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.6 13.6c1.8 2 5 2 6.8 0"/><path d="M9.3 9.6v.6M14.7 9.6v.6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8.5h3.6l1.7-2.5h6.4l1.7 2.5h3.6v10h-17z"/><circle cx="12" cy="13.2" r="3.3"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4.5M8 8.2l4-3.7 4 3.7"/><path d="M8.5 11H6v8.5h12V11h-2.5"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4.5V15M8 11.3l4 3.7 4-3.7"/><path d="M5.5 19.5h13"/></symbol>
    </defs>
  </svg>

  <div id="stage"></div>

  <div id="loading">
    <svg class="sigil" viewBox="0 0 120 120" aria-hidden="true">
      <g class="ring-a"><circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="51" stroke-dasharray="1.5 6"/></g>
      <g class="ring-b"><rect x="24.5" y="24.5" width="71" height="71"/></g>
      <g class="ring-c"><path d="M60 14 L100 83 L20 83 Z"/><circle cx="60" cy="60" r="23"/></g>
      <circle class="core" cx="60" cy="60" r="3"/>
    </svg>
    <!-- 渡海時換成這艘在浪上起伏的小船 -->
    <svg class="crossing-boat" viewBox="0 0 160 70" aria-hidden="true">
      <g class="boat"><path d="M52 40 Q80 52 108 40 L102 48 Q80 56 58 48 Z"/><path d="M80 40 V14 M80 16 L98 36 H80"/></g>
      <path class="wave w1" d="M0 52 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
      <path class="wave w2" d="M0 60 q10 -4 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
    </svg>
    <img class="brand" src="assets/wordmark-flat-gold.svg" alt="煉金畫廊">
    <div class="msg">載入中</div>
  </div>
  <script>
    // 從別的區域搭船過來：一開頁就是渡海的畫面，不先閃一下轉圈的符號
    (function () {
      var q = new URLSearchParams(location.search);
      if (!q.has('from')) return;
      var el = document.getElementById('loading');
      el.classList.add('crossing');
      el.querySelector('.msg').textContent = q.get('z') === 'haishi' ? '渡海　往海市' : '渡海　回畫廊';
    })();
  </script>

  <div id="toast"></div>
  <div id="hint"></div>

  <div id="top-btns">
    <span id="online" hidden></span>
    <button id="sound-btn" class="icon-btn round" aria-label="靜音" title="靜音" hidden><svg class="on"><use href="#i-sound"/></svg><svg class="off"><use href="#i-mute"/></svg></button>
    <button id="photo-btn" class="icon-btn round" aria-label="攝影模式" title="攝影模式（P）"><svg><use href="#i-camera"/></svg></button>
    <button id="director-btn" class="icon-btn round" aria-label="導演運鏡" aria-pressed="true" title="導演運鏡（R）"><svg viewBox="0 0 24 24"><path class="board" d="M4.5 10.5h15v9h-15z"/><path d="M4.5 13.5h15"/><g class="stick"><path d="M4.5 10.5L4 7.3l14.6-2.6.5 3.2z"/><path d="M8.9 9.7l1.2-4.5M13.6 8.9l1.2-4.5"/></g></svg></button>
    <button id="list-btn" class="icon-btn" aria-label="作品清單" title="作品清單"><svg><use href="#i-list"/></svg><span>清單</span></button>
  </div>

  <div id="joy" aria-label="移動搖桿"><div id="joy-knob"></div></div>
  <button id="swap-btn" aria-label="搖桿換邊" title="搖桿換邊"><svg><use href="#i-swap"/></svg></button>
  <button id="jump-btn" class="seal" aria-label="跳躍">跳</button>
  <button id="sit-btn" class="seal" aria-label="坐下">坐</button>
  <button id="action-btn" aria-label="看畫"><span class="a1">看畫</span><span class="a2" id="action-title"></span></button>

  <div id="emote" hidden>
    <button id="emote-btn" class="icon-btn round" aria-label="表情" title="表情（1–5）"><svg><use href="#i-emote"/></svg></button>
    <div id="emote-bar"></div>
  </div>

  <aside id="sheet" class="panel" aria-live="polite">
    <button id="sheet-close" class="icon-btn round close" aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    <div class="sheet-head">
      <button id="sheet-thumb" aria-label="看大圖"><img id="sheet-img" alt=""><span class="zoom">放大</span></button>
      <div class="sheet-titles">
        <h1 id="sheet-title"></h1>
        <p id="sheet-meta" class="meta"></p>
      </div>
    </div>
    <div class="sheet-body">
      <p id="sheet-note" class="note"></p>
      <div class="sheet-foot">
        <span id="sheet-price" class="price"></span>
        <span id="sheet-action"></span>
      </div>
    </div>
  </aside>

  <aside id="dress" class="panel" aria-label="捏角色">
    <button id="dress-close" class="icon-btn round close" aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    <div class="dress-head">
      <h2>鏡子<small>Speculum</small></h2>
      <button id="dress-dice" class="mini">骰子</button>
      <button id="dress-reset" class="mini">重來</button>
    </div>
    <nav id="dress-tabs"></nav>
    <div id="dress-body"></div>
  </aside>

  <!-- 攝影模式：取景框裡看到的就是拍下來的樣子 -->
  <div id="photo" hidden>
    <div id="ph-frame"><div class="grain"></div><div class="vig"></div><div class="grid"></div><img class="sig" src="assets/wordmark-flat-light.svg" alt=""></div>
    <div id="ph-rec" hidden><i></i><span>00:00</span></div>
    <div id="ph-zoom"></div>
    <div id="ph-bar"><div id="ph-chips"></div></div>
    <div id="ph-menu" hidden></div>
    <button id="ph-exit" class="icon-btn round" aria-label="離開攝影模式" title="離開（Esc）"><svg><use href="#i-close"/></svg></button>
    <div id="ph-shoot">
      <div id="ph-lens" role="group" aria-label="鏡頭"></div>
      <div class="ph-keys">
        <button id="ph-shutter" aria-label="拍照" title="拍照（空白鍵）"></button>
        <button id="ph-record" aria-label="錄影" title="錄影，最長一分鐘"><i></i></button>
      </div>
    </div>
    <div id="ph-alt" role="group" aria-label="高度"></div>
    <div id="ph-result" hidden>
      <div id="ph-media"></div>
      <p id="ph-tip"></p>
      <div class="ph-actions">
        <button id="ph-share" class="btn primary"><svg><use href="#i-share"/></svg>分享</button>
        <button id="ph-save" class="btn"><svg><use href="#i-save"/></svg>下載</button>
        <button id="ph-again" class="btn">繼續拍</button>
      </div>
    </div>
  </div>

  <div id="viewer">
    <img id="viewer-img" alt="">
    <button id="viewer-close" class="icon-btn round" aria-label="關閉"><svg><use href="#i-close"/></svg></button>
  </div>

  <div id="list">
    <header>
      <span class="list-title">作品清單<small>Catalogus</small></span>
      <button id="list-close" class="icon-btn round" aria-label="回到畫廊"><svg><use href="#i-close"/></svg></button>
    </header>
    <div id="list-body"></div>
  </div>

  <script type="module" src="js/main.js?v=202610311702"></script>
</body>
