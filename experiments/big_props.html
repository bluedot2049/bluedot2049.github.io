<!doctype html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大型環境裝飾物設計標本 — 煉金畫廊風格</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #141114;
      color: #f5e9d4;
      font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .note {
      position: fixed;
      top: 14px;
      left: 16px;
      max-width: 560px;
      padding: 11px 15px;
      background: rgba(20, 14, 11, 0.84);
      border: 1px solid rgba(232, 184, 106, 0.28);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      pointer-events: none;
    }
    .note strong { color: #f6dba6; font-weight: 600; }
    .note .meta {
      color: #b5a084;
      font-size: 12px;
      margin-top: 3px;
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 16px 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      background: linear-gradient(transparent, rgba(12, 8, 6, 0.9));
    }
    .bar button {
      padding: 6px 12px;
      border: 1px solid #5a4e3e;
      border-radius: 999px;
      background: #241c16;
      color: #d8ccb8;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }
    .bar button:hover { border-color: #a9763a; color: #f5e9d4; }
    .bar button.on { border-color: #e8b86a; color: #f6dba6; background: #382819; }
    .bar .sep { width: 1px; background: #5a4e3e; margin: 0 4px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.min.js" } }
  </script>
</head>

<body>
  <div class="note" id="info"></div>
  <div class="bar">
    <button data-item="all" class="on">全覽（6 座大型景觀物件）</button>
    <button data-item="0">1 海市煮茶涼棚</button>
    <button data-item="1">2 黑森林絞架鍋</button>
    <button data-item="2">3 沙島日晷圭表</button>
    <button data-item="3">4 月球配方販賣亭</button>
    <button data-item="4">5 古城烏鴉燈柱</button>
    <button data-item="5">6 對影冷凝管架</button>
    <span class="sep"></span>
    <button id="btnCompare">對照：預設 vs 這裡</button>
    <button id="btnForm">灰泥 (-form)</button>
    <button id="btnWire">線框</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Kit, newBucket, mergeBucket, rng } from '../js/core/props.js';
    import { uTime } from '../js/core/scenery.js';
    import { Character } from '../js/avatar/character.js';
    import { sanitizeLook } from '../js/avatar/looks.js';

    const params = new URLSearchParams(location.search);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const BG_NORMAL = new THREE.Color(0x141114);
    const BG_FORM = new THREE.Color(0x98a2ac);
    const scene = new THREE.Scene();
    scene.background = BG_NORMAL.clone();

    const hemi = new THREE.HemisphereLight(0xfff0d8, 0x322b2e, 1.48);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffe4bc, 1.32);
    sun.position.set(5.5, 8.2, 6.4);
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0x88a8cc, 0.38);
    rim.position.set(-5.0, 3.6, -4.2);
    scene.add(rim);

    // ── 共用材質：平面著色 + 頂點色（大型地表物件開啟 ao 底深頂亮） ──
    const matLit = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
    const matGlow = new THREE.MeshBasicMaterial({ vertexColors: true });
    const matForm = new THREE.MeshLambertMaterial({ color: 0xcfc8bc, flatShading: true });
    const matWire = new THREE.MeshBasicMaterial({ color: 0xffe09a, wireframe: true, transparent: true, opacity: 0.28 });

    // ── 色票（不碰純黑純白，遵照美術原則） ──
    const WOOD = '#422818', WOOD_HI = '#6d4528', OLD_WOOD = '#543e2d', LIGHT_WOOD = '#865836', LIGHT_WOOD_HI = '#ac7546';
    const FIR = '#2d221b', FIR_HI = '#4d3a2c', BAMBOO = '#8d6e42', BAMBOO_HI = '#c4a268';
    const SLATE = '#434b56', SLATE_HI = '#677382', SLATE_DK = '#2f363f';
    const SNOW = '#aeb8c2', SNOW_HI = '#cbd5de';
    const SAND = '#9c8468', SAND_HI = '#c6ad8e', ALABASTER = '#c4bcab', ALABASTER_HI = '#e2dac8';
    const BASALT = '#222126', BASALT_HI = '#36343c';
    const GOLD = '#a8823c', GOLD_HI = '#d6ae58', BRONZE = '#74562c', BRONZE_HI = '#ae8344';
    const COPPER = '#8d482a', COPPER_HI = '#cf7448', RUST = '#4d261a', RUST_HI = '#784638';
    const IRON = '#242224', IRON_HI = '#424044', STEEL = '#646a72', STEEL_HI = '#9aa1aa';
    const CELADON = '#3b6264', CELADON_HI = '#6d9890', WARN_RED = '#5e221c', WARN_RED_HI = '#863026';
    const HEMP = '#948264', HEMP_HI = '#baa786', BONE = '#b3a891', BONE_HI = '#d6cab0';
    const MOSS = '#486038', MOSS_HI = '#789252', FERN = '#2b4426', FERN_HI = '#7c964e';
    const CROW = '#1b1a1d', CROW_HI = '#323036';

    const _y = new THREE.Vector3(0, 1, 0), _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();

    function aim(axis, dir) {
      _q.setFromUnitVectors(axis, dir.clone().normalize());
      _e.setFromQuaternion(_q, 'YXZ');
      return { rx: _e.x, ry: _e.y, rz: _e.z };
    }

    function rod(k, a, b, r1, r2, c, o = {}, seg = 6) {
      const d = new THREE.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
      k.cyl(r2, r1, d.length(), c, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, { ...o, ...aim(_y, d) }, seg);
    }

    function blade(k, a, b, w0, w1, t, c, n = [0, 0, 1], o = {}) {
      const d = new THREE.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]), L = d.length();
      d.normalize();
      const x = new THREE.Vector3().crossVectors(d, new THREE.Vector3(...n)).normalize();
      const z = new THREE.Vector3().crossVectors(x, d);
      _q.setFromRotationMatrix(_m.makeBasis(x, d, z));
      _e.setFromQuaternion(_q, 'YXZ');
      k.cyl(w1, w0, L, c, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, {
        ...o, rx: _e.x, ry: _e.y, rz: _e.z, sz: t / Math.max(w0, w1, 0.001),
      }, 4);
    }

    function ring(k, r, tube, c, x, y, z, o = {}, seg = 8, rad = 4, arc = Math.PI * 2) {
      k.add(new THREE.TorusGeometry(r, tube, rad, seg, arc), c, x, y, z, o);
    }

    // 帶 heightSegments 的彎曲圓柱（讓 lean / bow 真正彎出單側 C 弧）
    function bentCyl(k, rt, rb, h, c, x, y, z, o = {}, seg = 7, hSeg = 5) {
      k.add(new THREE.CylinderGeometry(rt, rb, h, seg, hSeg), c, x, y, z, o);
    }

    function bentCone(k, r, h, c, x, y, z, o = {}, seg = 7, hSeg = 5) {
      k.add(new THREE.ConeGeometry(r, h, seg, hSeg), c, x, y, z, o);
    }

    function buildGroup(fn, seed = 'big', ao = true) {
      const k = new Kit(rng(seed)), b = newBucket();
      const extra = fn(k) || {};
      k.emit(b, 0, 0, 0);
      const g = new THREE.Group();
      let tris = 0;
      const litGeo = mergeBucket(b.lit, ao);
      if (litGeo) {
        tris += litGeo.attributes.position.count / 3;
        const m = new THREE.Mesh(litGeo, matLit);
        m.userData.role = 'lit';
        g.add(m);
      }
      const glowGeo = mergeBucket(b.glow, false);
      if (glowGeo) {
        tris += glowGeo.attributes.position.count / 3;
        const m = new THREE.Mesh(glowGeo, matGlow);
        m.userData.role = 'glow';
        g.add(m);
      }
      if (extra.setup) tris += extra.setup(g) || 0;
      g.userData.tris = Math.round(tris);
      g.userData.parts = b.lit.length + b.glow.length + (extra.parts || 0);
      g.userData.tick = extra.tick || null;
      return g;
    }

    // ============================================================================
    // 6 座大型環境裝飾物（真實 1:1 尺度，高 2.0m ~ 2.8m，對齊角色身高）
    // ============================================================================
    const ITEMS = [
      {
        id: 'haishi_tea_kiosk',
        name: '1. 海市・街角煮茶銅甕涼棚',
        zone: '海市・燈巷轉角',
        height: 2.28,
        desc: '1:1 街角小棚尺度（高約 2.28m）：不對稱外傾雙老木柱嵌進冷灰 GRAY 石礎，托起一片前傾挑簷；橫樑吊著立臥交錯鐵鏈與 0.7 下垂肚的煙燻銅甕，底下馬蹄石灶燃著暖橘炭火，旁掛毛筆記號木茶牌與青瓷水甕。',
        build(k) {
          // 雙柱冷灰石礎（一左一右略差尺寸）
          k.cyl(0.14, 0.17, 0.22, SLATE, -0.46, 0.11, 0.0, { color2: SLATE_HI }, 7);
          k.cyl(0.13, 0.16, 0.19, SLATE, 0.44, 0.095, 0.02, { color2: SLATE_HI }, 7);

          // 不對稱雙老木柱（左高略外傾、右矮 4% 且帶輕微 bow）
          bentCyl(k, 0.048, 0.068, 1.96, WOOD, -0.45, 1.12, 0.0, { lean: [-0.07, 0.02], bow: [-0.025, 0, 0.3], color2: WOOD_HI }, 7, 5);
          bentCyl(k, 0.045, 0.064, 1.88, WOOD, 0.43, 1.07, 0.02, { lean: [0.05, -0.02], bow: [0.02, 0, 0.3], color2: WOOD_HI }, 7, 5);

          // 頂樑與挑簷斜棚（二段折彎前傾屋坡 + 4 根椽條 + 雙鐵角鉤）
          rod(k, [-0.62, 2.08, -0.04], [0.58, 2.00, 0.02], 0.052, 0.046, WOOD, { color2: WOOD_HI }, 6);
          for (const rx of [-0.46, -0.15, 0.16, 0.45]) {
            rod(k, [rx, 2.15, -0.34], [rx, 1.92, 0.44], 0.024, 0.02, OLD_WOOD, { color2: WOOD_HI }, 5);
          }
          // 上段後坡＋下段急垂前簷（單側前傾）
          k.box(1.36, 0.045, 0.56, WOOD, -0.02, 2.13, -0.11, { rx: 0.20, rz: -0.04, color2: WOOD_HI });
          k.box(1.40, 0.04, 0.38, FIR, -0.02, 1.97, 0.31, { rx: 0.44, rz: -0.04, color2: WOOD_HI });
          ring(k, 0.045, 0.011, IRON_HI, -0.68, 1.88, 0.45, { ry: Math.PI / 2 }, 7, 3, Math.PI * 1.35);
          ring(k, 0.045, 0.011, IRON_HI, 0.65, 1.83, 0.46, { ry: Math.PI / 2 }, 7, 3, Math.PI * 1.35);

          // 立臥交錯鐵鏈垂吊 0.7 重腹煙燻銅甕（正中負空間焦點，環環緊扣）
          for (let i = 0; i < 4; i++) {
            ring(k, 0.036, 0.0085, IRON_HI, -0.02, 2.00 - i * 0.056, 0.02, { ry: (i % 2) * Math.PI / 2 }, 6, 3);
          }
          // 銅甕提樑環與壺身（底寬重腹、上收頸口）
          ring(k, 0.115, 0.012, BRONZE, -0.02, 1.71, 0.02, {}, 7, 3, Math.PI);
          k.cyl(0.085, 0.105, 0.07, COPPER, -0.02, 1.66, 0.02, { color2: COPPER_HI }, 7);
          k.cyl(0.20, 0.085, 0.24, COPPER, -0.02, 1.51, 0.02, { color2: COPPER_HI }, 7);
          k.cyl(0.115, 0.20, 0.14, RUST, -0.02, 1.32, 0.02, { color2: COPPER }, 7);
          k.cyl(0.095, 0.095, 0.04, BRONZE, -0.02, 1.71, 0.02, { color2: GOLD }, 7);
          k.rock(0.032, GOLD, -0.02, 1.74, 0.02, { sy: 0.7, color2: GOLD_HI });

          // 底部馬蹄形冷灰石炭灶＋發光暖橘炭火
          k.cyl(0.32, 0.36, 0.26, SLATE_DK, -0.02, 0.13, 0.02, { color2: SLATE }, 7);
          k.cyl(0.26, 0.29, 0.22, SLATE, -0.02, 0.34, 0.02, { color2: SLATE_HI }, 7);
          // 灶口內凹暗穴與暖橘炭堆
          k.box(0.24, 0.18, 0.18, IRON, -0.02, 0.24, 0.20, {}, );
          k.rock(0.095, '#e85218', -0.02, 0.20, 0.18, { sx: 1.35, sy: 0.55, glow: true, color2: '#ffa834' });
          k.rock(0.065, '#ff7422', 0.04, 0.23, 0.21, { sy: 0.6, glow: true, color2: '#ffcb56' });

          // 右柱側挑臂與毛筆記號木茶牌（三道海市茶紋刷痕，避免撞砂島 I 字）
          rod(k, [0.43, 1.78, 0.02], [0.76, 1.84, 0.08], 0.022, 0.018, WOOD, { color2: WOOD_HI }, 5);
          k.box(0.24, 0.42, 0.035, LIGHT_WOOD, 0.68, 1.54, 0.08, { ry: 0.22, rz: 0.06, color2: LIGHT_WOOD_HI });
          k.box(0.14, 0.024, 0.042, IRON, 0.68, 1.65, 0.08, { ry: 0.22, rz: -0.18 });
          k.box(0.024, 0.17, 0.042, IRON, 0.64, 1.54, 0.08, { ry: 0.22, rz: -0.14 });
          k.box(0.024, 0.14, 0.042, IRON, 0.72, 1.55, 0.08, { ry: 0.22, rz: 0.18 });
          k.box(0.12, 0.022, 0.042, IRON, 0.68, 1.44, 0.08, { ry: 0.22, rz: 0.14 });

          // 左腳青瓷雙水甕與斜靠長柄木杓
          k.cyl(0.10, 0.13, 0.34, CELADON, -0.58, 0.17, 0.22, { color2: CELADON_HI }, 7);
          k.cyl(0.115, 0.095, 0.07, CELADON_HI, -0.58, 0.36, 0.22, {}, 7);
          k.cyl(0.075, 0.095, 0.26, CELADON, -0.36, 0.13, 0.28, { rz: -0.14, rx: 0.1, color2: CELADON_HI }, 7);
          rod(k, [-0.52, 0.04, 0.38], [-0.28, 0.68, 0.18], 0.014, 0.011, LIGHT_WOOD, { color2: LIGHT_WOOD_HI }, 5);
        },
      },

      {
        id: 'heilin_camp_crane',
        name: '2. 黑森林・獵人絞架吊鍋與警告牌',
        zone: '黑森林・林道轉角／谷底營地',
        height: 2.38,
        desc: '底寬頂窄＋單側 C 彎的深杉木懸臂絞架：腳下三大塊切面冷灰岩（一大兩小頂上帶苔墊）壓著 6 片斜弓劍形蕨葉；臂端 5 環立臥交錯鐵鏈吊起沉重黑鐵燉鍋與微光餘燼，樁腰斜釘暗紅警告木牌。',
        build(k) {
          // 聚成一團：一大兩小切面冷灰石＋頂上苔墊
          k.rock(0.32, SLATE_DK, -0.34, 0.15, -0.06, { sx: 1.25, sy: 0.68, color2: SLATE });
          k.rock(0.28, MOSS, -0.32, 0.26, -0.05, { sx: 1.05, sy: 0.26, color2: MOSS_HI });
          k.rock(0.20, SLATE, -0.56, 0.11, 0.16, { sx: 1.1, sy: 0.72, color2: SLATE_HI });
          k.rock(0.16, SLATE_DK, -0.14, 0.09, -0.24, { sx: 1.15, sy: 0.68, color2: SLATE });

          // 6 片劍葉蕨叢（根深尖亮，向外弓出下垂）
          for (let i = 0; i < 6; i++) {
            const a = -0.7 + i * 0.52;
            const len = 0.36 + (i % 3) * 0.08;
            const bx = -0.42 + Math.cos(a) * 0.08, bz = 0.18 + Math.sin(a) * 0.08;
            const tx = bx + Math.cos(a) * len, tz = bz + Math.sin(a) * len;
            const ty = 0.12 + (i % 2) * 0.07;
            blade(k, [bx, 0.03, bz], [tx, ty, tz], 0.048, 0.008, 0.01, FERN, [0, 1, 0], { color2: FERN_HI });
          }

          // 深杉木 C 彎主樁＋斜挑懸臂＋麻繩捆紮＋斜撐木肘
          bentCyl(k, 0.052, 0.086, 2.24, FIR, -0.26, 1.12, -0.02, { lean: [0.16, 0.03], bow: [-0.07, 0.02, 0.3], color2: FIR_HI }, 7, 6);
          const armOrigin = new THREE.Vector3(-0.18, 2.02, 0.01);
          const armTip = new THREE.Vector3(0.44, 2.16, 0.03);
          rod(k, armOrigin.toArray(), armTip.toArray(), 0.048, 0.032, FIR, { bow: [0, -0.035, 0.7], color2: FIR_HI }, 6);
          rod(k, [-0.14, 1.56, 0.01], [0.18, 2.06, 0.02], 0.028, 0.024, FIR, { color2: FIR_HI }, 5);
          // 麻繩捆紮圈
          ring(k, 0.062, 0.014, HEMP, -0.12, 2.01, 0.01, { rz: 0.4, color2: HEMP_HI }, 7, 3);
          ring(k, 0.058, 0.014, HEMP, -0.10, 1.98, 0.01, { rz: -0.3, color2: HEMP_HI }, 7, 3);

          // 5 環立臥轉 90 度鐵鏈（絕對不躺平成梯子）
          for (let i = 0; i < 5; i++) {
            ring(k, 0.044, 0.01, IRON_HI, 0.39, 2.06 - i * 0.068, 0.03, { ry: (i % 2) * Math.PI / 2 }, 7, 3);
          }

          // 沉重黑鐵燉鍋（底微圓扁＋雙側鍋耳＋貼合提樑弧）
          k.cyl(0.24, 0.14, 0.16, IRON, 0.39, 1.38, 0.03, { color2: IRON_HI }, 7);
          k.cyl(0.21, 0.24, 0.18, IRON, 0.39, 1.55, 0.03, { color2: IRON_HI }, 7);
          k.cyl(0.23, 0.22, 0.035, STEEL, 0.39, 1.65, 0.03, {}, 7);
          k.box(0.05, 0.05, 0.04, STEEL, 0.17, 1.66, 0.03, {});
          k.box(0.05, 0.05, 0.04, STEEL, 0.61, 1.66, 0.03, {});
          ring(k, 0.22, 0.011, IRON_HI, 0.39, 1.66, 0.03, {}, 8, 3, Math.PI);

          // 地面冷石火圈＋交叉焦柴＋微亮柴火餘燼
          for (let i = 0; i < 7; i++) {
            const a = i * (Math.PI * 2 / 7);
            k.rock(0.075, SLATE_DK, 0.39 + Math.cos(a) * 0.26, 0.05, 0.03 + Math.sin(a) * 0.26, { sy: 0.62, color2: SLATE });
          }
          rod(k, [0.22, 0.03, -0.12], [0.56, 0.09, 0.18], 0.028, 0.022, FIR, {}, 5);
          rod(k, [0.22, 0.09, 0.18], [0.55, 0.03, -0.10], 0.026, 0.022, FIR, {}, 5);
          k.rock(0.085, '#df4818', 0.39, 0.06, 0.03, { sx: 1.4, sy: 0.45, glow: true, color2: '#ffa030' });

          // 微歪暗紅警告木牌（#5e221c）＋舊骨色叉號警告標記＋帶黃獸角骨（#b3a891）
          k.box(0.46, 0.28, 0.04, WARN_RED, -0.12, 1.18, 0.08, { rz: -0.09, ry: 0.25, color2: WARN_RED_HI });
          k.box(0.18, 0.03, 0.046, BONE_HI, -0.18, 1.19, 0.095, { ry: 0.25, rz: 0.62 });
          k.box(0.18, 0.03, 0.046, BONE_HI, -0.18, 1.19, 0.095, { ry: 0.25, rz: -0.78 });
          k.box(0.18, 0.025, 0.045, FIR_HI, -0.03, 1.22, 0.075, { rz: -0.10, ry: 0.25 });
          k.box(0.14, 0.025, 0.045, FIR_HI, -0.02, 1.14, 0.075, { rz: -0.14, ry: 0.25 });

      const pk = new Kit(null), pb = newBucket();
      pk.cyl(0.86, 0.92, 0.04, '#3a3335', 0, 0.02, 0, { color2: '#4d4447' }, 9);
      pk.emit(pb, px, pz, 0);
      const pm = new THREE.Mesh(mergeBucket(pb.lit, true), matLit);
      pm.userData.role = 'lit';
      showcaseRoot.add(pm);

      const g = buildGroup(it.build, it.id, true);
      g.position.set(px, 0.04, pz);
      g.rotation.y = rot;
      showcaseRoot.add(g);
      propGroups.push({ g, x: px, y: it.height * 0.48, z: pz, dist: Math.max(4.8, it.height * 2.15), item: it });
    });

    // 站在一旁的 1.7m 女巫角色（提供直接的 1:1 比例尺）
    const character = new Character(shadowTexture(), sanitizeLook({}));
    character.group.position.set(-5.75, 0, 0.72);
    character.group.rotation.y = 0.62;
    showcaseRoot.add(character.group);

    function shadowTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d').createRadialGradient(32, 32, 2, 32, 32, 30);
      g.addColorStop(0, 'rgba(0,0,0,0.45)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.getContext('2d').fillStyle = g;
      c.getContext('2d').fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    // ============================================================================
    // 對照展場（全尺寸 1:1 對照）：左灰墊（一般 AI/預設做法） vs 右金墊（這世界的做法）
    // ============================================================================
    const compareRoot = new THREE.Group();
    compareRoot.visible = false;
    scene.add(compareRoot);

    const COMPARISONS = [
      {
        title: '古城烏鴉燈柱：24 段亮銀直圓柱＋純白球燈 vs 底寬頂窄鍛鐵＋微凹巫師帽尖蓋＋鳥棲懸籠燭火',
        bad(k) {
          k.cyl(0.24, 0.24, 0.16, '#888888', 0, 0.08, 0, { ao: false }, 24);
          k.add(new THREE.CylinderGeometry(0.055, 0.055, 2.35, 24), '#c4ccd4', 0, 1.32, 0, { ao: false });
          k.add(new THREE.CylinderGeometry(0.02, 0.02, 0.55, 16), '#c4ccd4', 0.24, 2.35, 0, { rz: Math.PI / 2, ao: false });
          k.add(new THREE.SphereGeometry(0.16, 24, 16), '#ffffff', 0.48, 2.22, 0, { glow: true, ao: false });
        },
        good(k) {
          return ITEMS[4].build(k);
        },
      },
      {
        title: '海市煮茶涼棚：全對稱筆直雙柱＋平蓋＋圓柱桶 vs 不對稱挑簷＋立臥鐵鏈＋0.7 腹銅甕＋石灶炭火',
        bad(k) {
          k.add(new THREE.CylinderGeometry(0.055, 0.055, 2.0, 20), '#7a4d2c', -0.45, 1.0, 0, { ao: false });
          k.add(new THREE.CylinderGeometry(0.055, 0.055, 2.0, 20), '#7a4d2c', 0.45, 1.0, 0, { ao: false });
          k.box(1.2, 0.08, 0.72, '#603b22', 0, 2.04, 0, { ao: false });
          k.add(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 12), '#999999', 0, 1.75, 0, { ao: false });
          k.add(new THREE.CylinderGeometry(0.18, 0.18, 0.36, 24), '#aa5522', 0, 1.38, 0, { ao: false });
        },
        good(k) {
          return ITEMS[0].build(k);
        },
      },
    ];

    const compareStats = [];
    {
      const ck = new Kit(null), cb = newBucket();
      ck.cyl(4.6, 4.9, 0.16, '#262124', 0, -0.08, 0, {}, 20);
      COMPARISONS.forEach((_, i) => {
        const cx = (i - 0.5) * 3.6;
        ck.cyl(0.84, 0.88, 0.04, '#44484d', cx - 0.84, 0.02, -0.15, {}, 12);
        ck.cyl(0.88, 0.92, 0.045, GOLD, cx + 0.84, 0.022, 0.15, { color2: GOLD_HI }, 12);
      });
      ck.emit(cb, 0, 0, 0);
      const bm = new THREE.Mesh(mergeBucket(cb.lit, true), matLit);
      bm.userData.role = 'lit';
      compareRoot.add(bm);

      COMPARISONS.forEach((cmp, i) => {
        const cx = (i - 0.5) * 3.6;
        const badG = buildGroup(cmp.bad, 'bigbad_' + i, false);
        badG.position.set(cx - 0.84, 0.04, -0.15);
        compareRoot.add(badG);

        const goodG = buildGroup(cmp.good, 'biggood_' + i, true);
        goodG.position.set(cx + 0.84, 0.045, 0.15);
        compareRoot.add(goodG);

        compareStats.push(`${i + 1}. 左（預設）${badG.userData.tris} tris → 右（這裡）${goodG.userData.tris} tris`);
      });
    }

    // ============================================================================
    // 互動控制
    // ============================================================================
    const state = {
      item: params.get('item') || 'all',
      compare: params.get('compare') === '1',
      form: params.get('form') === '1',
      wire: params.get('wire') === '1',
    };

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.08, 90);
    const target = new THREE.Vector3(-0.3, 1.15, -0.35);
    const goalTarget = target.clone();
    let yaw = 0.08, pitch = 0.24, dist = 12.6, goalDist = 12.6;
    if (params.has('yaw')) yaw = +params.get('yaw');
    if (params.has('pitch')) pitch = +params.get('pitch');

    const infoEl = document.getElementById('info');
    function updateUI() {
      showcaseRoot.visible = !state.compare;
      compareRoot.visible = state.compare;
      scene.background = state.form ? BG_FORM : BG_NORMAL;
      hemi.intensity = state.form ? 1.15 : 1.48;

      scene.traverse((o) => {
        if (!o.isMesh) return;
        if (o.userData.role === 'lit') o.material = state.form ? matForm : matLit;
        if (o.userData.role === 'glow') o.material = state.form ? matForm : matGlow;
        if (o.userData.isWire) o.visible = state.wire;
      });

      document.getElementById('btnCompare').classList.toggle('on', state.compare);
      document.getElementById('btnForm').classList.toggle('on', state.form);
      document.getElementById('btnWire').classList.toggle('on', state.wire);

      for (const b of document.querySelectorAll('[data-item]')) {
        b.classList.toggle('on', !state.compare && b.dataset.item === String(state.item));
      }

      if (state.compare) {
        goalTarget.set(0, 1.28, 0);
        goalDist = 8.4;
        infoEl.innerHTML = `<strong>1:1 全尺寸對照模式：左後灰墊「一般 AI／預設做法」 vs 右前金墊「這世界的做法」</strong><br>` +
          `1. 古城烏鴉燈柱：24 段亮銀直筒＋純白發光球 vs 冷石雪沿＋微凹巫師帽尖頂＋烏鴉懸籠燭火。<br>` +
          `2. 海市煮茶涼棚：對稱垂直木框＋圓筒鍋 vs 外傾雙柱＋單側挑簷＋立臥鐵鏈與 0.7 腹銅甕。` +
          `<div class="meta">${compareStats.join('　｜　')}</div>`;
      } else if (state.item === 'all') {
        goalTarget.set(-0.35, 1.15, -0.35);
        goalDist = 12.8;
        const totalTris = ITEMS.reduce((s, it) => s + it.tris, 0);
        infoEl.innerHTML = `<strong>大型環境裝飾物標本場（6 座 1:1 尺度景觀道具，左側女巫高約 1.7m 為比例尺）</strong><br>` +
          `涵蓋海市、黑森林、沙島、月球靜海、古城與對影東翼，皆以底寬頂窄、0.3/0.7 單側偏弧、負空間構架與低面數頂點漸層塑形。` +
          `<div class="meta">6 座合計 <strong>${totalTris}</strong> 個三角形（平均每座 ${Math.round(totalTris / ITEMS.length)} tris）。點下方按鈕可逐座拉近 360° 旋轉檢視。</div>`;
      } else {
        const idx = +state.item;
        const m = propGroups[idx];
        if (m) {
          goalTarget.set(m.x, m.y, m.z);
          goalDist = m.dist;
          const it = m.item;
          infoEl.innerHTML = `<strong>${it.name}</strong>（${it.zone}，高約 ${it.height.toFixed(2)}m）<br>${it.desc}` +
            `<div class="meta">面數：<strong>${it.tris}</strong> 個三角形　｜　組件：${it.parts} 個基本圖元（合併為單一網格）　｜　拖曳可 360° 旋轉檢視切面與接地</div>`;
        }
      }
    }

    scene.traverse((o) => {
      if (o.isMesh && o.userData.role === 'lit') {
        const w = new THREE.Mesh(o.geometry, matWire);
        w.userData.isWire = true;
        w.visible = false;
        o.add(w);
      }
    });

    ITEMS.forEach((it, i) => {
      it.tris = propGroups[i].g.userData.tris;
      it.parts = propGroups[i].g.userData.parts;
    });

    for (const b of document.querySelectorAll('[data-item]')) {
      b.onclick = () => {
        state.compare = false;
        state.item = b.dataset.item;
        updateUI();
      };
    }
    document.getElementById('btnCompare').onclick = () => { state.compare = !state.compare; updateUI(); };
    document.getElementById('btnForm').onclick = () => { state.form = !state.form; updateUI(); };
    document.getElementById('btnWire').onclick = () => { state.wire = !state.wire; updateUI(); };

    let drag = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      yaw -= (e.clientX - drag[0]) * 0.007;
      pitch = Math.max(-0.18, Math.min(1.32, pitch + (e.clientY - drag[1]) * 0.007));
      drag = [e.clientX, e.clientY];
    });
    addEventListener('pointerup', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => {
      goalDist = Math.max(1.8, Math.min(26, goalDist * (1 + e.deltaY * 0.001)));
    }, { passive: true });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    updateUI();
    if (params.has('dist')) { dist = goalDist = +params.get('dist'); }
    target.copy(goalTarget);

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      uTime.value = clock.getElapsedTime();

      for (const m of propGroups) m.g.userData.tick?.(m.g, uTime.value, state);
      character.update(dt, 0);

      target.lerp(goalTarget, Math.min(1, dt * 8));
      dist += (goalDist - dist) * Math.min(1, dt * 8);
      const c = Math.cos(pitch);
      camera.position.set(target.x + Math.sin(yaw) * c * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * c * dist);
      camera.lookAt(target);
      renderer.render(scene, camera);
    });

    window.__bigProps = { state, updateUI, ITEMS };
    window.__ready = true;
  </script>
</body>

</html>
