<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>介面音效試聽</title>
  <!-- 介面的寶石聲（js/audio/ui-voices.js）一顆一顆聽：每個代號一顆鈕，根音照區切，手機喇叭模式，整體高低、長短；下面是幾段真的會出現的連續動作，材質聲（wear-voices.js 的 MAT）擺在旁邊對照 -->
  <style>
    html, body { margin: 0; background: #1c1814; color: #e9e0cc; font-family: "Noto Serif TC", serif; }
    main { max-width: 900px; margin: 0 auto; padding: 18px 16px 48px; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; color: #c9a86e; }
    h2 { font-size: 14px; font-weight: 600; color: #c9a86e; margin: 26px 0 8px; }
    .note { font-size: 13px; opacity: .65; margin-top: 4px; line-height: 1.6; }
    .bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-size: 13px; }
    .bar label { display: flex; gap: 6px; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    button { padding: 9px 12px; border: 1px solid #5a4e3e; border-radius: 6px; background: #2a241e; color: inherit; font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
    button:active { background: #e8b86a; color: #1b1714; }
    button small { display: block; font-size: 11px; opacity: .6; margin-top: 2px; }
    .w { color: #e8b86a; font-size: 11px; }
    select, input[type=range] { font: inherit; }
    #log { font: 12px/1.6 Consolas, monospace; opacity: .7; margin-top: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>介面音效試聽</h1>
  <div class="note">第一下點畫面才建聲音。每顆按下去都會差一點高低大小，連按幾次聽。音量是遊戲裡的實際值，喇叭開到平常玩的大小。</div>
  <div id="warn" class="note" style="opacity:1;color:#ffb38a;display:none"></div>
  <div class="note" id="state">聲音：還沒開（點任何一顆）</div>
  <script>
    // 直接雙擊開檔（file://）時瀏覽器不讓模組載入，整頁只剩字。提示改用本機伺服器
    (function () {
      var w = document.getElementById('warn');
      function say(t) { w.innerHTML = t; w.style.display = 'block'; }
      if (location.protocol === 'file:') say('這一頁要用伺服器開才會動：先雙擊專案資料夾裡的「開啟畫廊.bat」，再到瀏覽器打開 <b>http://localhost:8000/experiments/ui_sounds.html</b>');
      else setTimeout(function () { if (!document.querySelector('#kinds button')) say('程式沒載進來（按 F12 看主控台的錯誤）。網站上還沒有這一頁的話，要先跑「更新網站.bat」。'); }, 3000);
    })();
  </script>
  <div class="bar">
    <label>區（根音）<select id="zone"></select></label>
    <label><input type="checkbox" id="coarse"> 手機喇叭（整體壓 0.7）</label>
    <label>整體高低 <input type="range" id="pitch" min="0.7" max="1.4" step="0.01" value="1"><b id="pitchV">1.00</b></label>
    <label>整體長短 <input type="range" id="length" min="0.5" max="2" step="0.05" value="1"><b id="lengthV">1.00</b></label>
    <label>音量 ×<input type="range" id="gain" min="0.25" max="3" step="0.05" value="1"><b id="gainV">1.00</b></label>
  </div>

  <h2>新舊對照（2026-11-04：布和紙太硬太尖、確認太電子）</h2>
  <div class="grid" id="cmp"></div>

  <h2>一顆一顆</h2>
  <div class="grid" id="kinds"></div>

  <h2>連續動作（遊戲裡真的會這樣響）</h2>
  <div class="grid" id="seqs"></div>

  <h2>材質聲對照（wear-voices.js 的 MAT，面板的身體）</h2>
  <div class="grid" id="mats"></div>
  <div id="log"></div>
</main>
<script type="module">
  import { UI, LEVEL, ROOT, TUNE, uiSound, setZone, gem, note } from '../js/audio/ui-voices.js';
  import { air, hiss } from '../js/audio/ambience-voices.js';
  import { MAT } from '../js/audio/wear-voices.js';

  const $ = (id) => document.getElementById(id);
  const log = (s) => { $('log').textContent = [s, ...$('log').textContent.split('\n')].slice(0, 12).join('\n'); };

  // 跟 ambience.js 一樣的出口，只差沒有場景
  const amb = {
    ctx: null, noise: null, muted: false, gone: false, sfx: null, gain: 1,
    start() {
      if (this.ctx) return;
      const ctx = this.ctx = new AudioContext();
      this.sfx = ctx.createGain();
      this.sfx.connect(ctx.destination);
      // 跟 ambience.js 同一種偏粉紅的雜訊（白雜訊高頻多很多，布和紙會比遊戲裡尖）
      const n = ctx.sampleRate * 8, buf = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < n; i++) {
          const w = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + w * 0.029591;
          b1 = 0.985 * b1 + w * 0.032534;
          b2 = 0.95 * b2 + w * 0.048056;
          d[i] = (b0 + b1 + b2 + w * 0.05) * 0.9;
        }
      }
      this.noise = buf;
    },
    out(vol, pan) {
      const out = this.ctx.createGain();
      out.gain.value = vol * this.gain;
      const p = this.ctx.createStereoPanner();
      p.pan.value = pan;
      out.connect(p).connect(this.sfx);
      return out;
    },
    played() {},
    allow(gate, rate, burst) {
      const now = this.ctx.currentTime;
      gate.n = Math.min(burst, (gate.n ?? burst) + (now - (gate.at ?? now)) * rate);
      gate.at = now;
      if (gate.n < 1) return false;
      gate.n--;
      return true;
    },
  };
  document.addEventListener('pointerdown', () => amb.start(), { capture: true });
  // 看得到聲音到底開了沒：瀏覽器擋自動播放、分頁被靜音時一眼就知道
  setInterval(() => {
    const s = amb.ctx?.state;
    $('state').textContent = !s ? '聲音：還沒開（點任何一顆）' : s === 'running' ? '聲音：開著' : `聲音：${s}（再點一下）`;
    if (s && s !== 'running') amb.ctx.resume().catch(() => {});
  }, 300);

  const DESC = {
    tap: ['觸感', '部位小格、看鏡、勾選'], focus: ['焦點移一格', '手把，限速 12/秒'], tab: ['分頁／圓章', '四個固定的音，連按輪著'],
    open: ['開', '往上兩音'], close: ['關', '往下兩音'], up: ['一聲往上', '越肩、錄影開始'], down: ['一聲往下', 'B 退一層、Esc'],
    confirm: ['確認 A', '實物寶石：答應邀請、好了'], seal: ['蓋印 B', '存下、存檔、衣櫃存一套'], deny: ['不行', '短，掉到音階外'], fail: ['失敗', '沉重暗色，讀不出存檔碼'],
    land: ['放到位', '行囊拖著放下'], call: ['有人找你', '邀請卡跳出來'], send: ['話送出去', '兩顆往上'], far: ['隊友的話', '遠處一顆，左右照方位'],
  };
  let tabI = 0;
  for (const k of Object.keys(UI)) {
    const b = document.createElement('button');
    b.innerHTML = `${DESC[k][0]} <span class="w">${k} · ${LEVEL[k]}</span><small>${DESC[k][1]}</small>`;
    b.onclick = () => { amb.start(); uiSound(amb, k, k === 'tab' ? { i: tabI++ } : k === 'far' ? { pan: Math.random() * 1.6 - 0.8 } : {}); log(k); };
    $('kinds').appendChild(b);
  }

  // 材質聲：wear-voices 的 play() 怎麼叫就怎麼叫（VOL 0.4）
  const mat = (kind, vol = 0.4, dt = 0) => setTimeout(() => {
    const ctx = amb.ctx, p = 0.94 + Math.random() * 0.12;
    MAT[kind](ctx, amb.out(vol * (0.85 + Math.random() * 0.15), 0), ctx.currentTime + 0.02, p, amb.noise);
  }, dt * 1000);
  const ui = (k, dt = 0, o) => setTimeout(() => uiSound(amb, k, o), dt * 1000);
  const SEQ = {
    '開行囊 → 換到存讀檔 → 存下 → 關': () => { mat('leather'); ui('tap', 0.12); ui('tab', 0.9, { i: 1 }); ui('tap', 1.8); ui('seal', 2.3); mat('leather', 0.3, 3.4); },
    '作品資訊開（紙）→ 放大圖 → 收': () => { mat('paper'); ui('up', 0.9); ui('down', 1.9); mat('paper', 0.3, 2.5); },
    '四顆圓章左右切': () => { for (let i = 0; i < 4; i++) ui('tab', i * 0.3, { i }); for (let i = 2; i >= 0; i--) ui('tab', 1.5 + (2 - i) * 0.3, { i }); },
    '手把焦點走四格 → A 開 → B 退': () => { for (let i = 0; i < 4; i++) ui('focus', i * 0.18); ui('open', 1.0); ui('down', 2.0); },
    '暫停開 → 關': () => { ui('down'); ui('up', 1.4); },
    '有人邀請 → 答應': () => { ui('call'); ui('confirm', 1.6); },
    '有人邀請 → 不了': () => { ui('call'); ui('deny', 1.6); },
    '打字 → 送出 → 隊友回話': () => { ui('up'); ui('send', 1.2); ui('far', 2.4, { pan: 0.6 }); },
    '衣櫃存一套（蓋印）': () => { ui('tab', 0, { i: 3 }); ui('seal', 0.6); },
    '讀存檔碼：讀不出來': () => { ui('tap'); ui('fail', 0.5); },
    '行囊拖到位': () => { ui('land'); },
  };
  for (const [name, fn] of Object.entries(SEQ)) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { amb.start(); fn(); log(name); };
    $('seqs').appendChild(b);
  }
  // 舊版原樣抄在這裡，只為了對照（遊戲裡已經換掉）
  const OLD = {
    cloth(ctx, out, t, p, noise) {
      air(ctx, out, noise, t, [[0, 1300 * p], [0.16, 2600 * p]], 0.05, 0.18, 0.85, 1.1, 'bandpass');
      air(ctx, out, noise, t + 0.15, [[0, 2200 * p], [0.14, 1500 * p]], 0.04, 0.16, 0.5, 1.1, 'bandpass');
    },
    paper(ctx, out, t, p, noise) {
      air(ctx, out, noise, t, [[0, 900 * p], [0.22, 3000 * p], [0.3, 1600 * p]], 0.1, 0.3, 0.9, 1.3, 'bandpass');
      hiss(ctx, out, noise, t + 0.27, 0.01, 'highpass', 1800, 0.7);
    },
    confirm(ctx, out, t) {
      gem(ctx, out, t, { f: note(0, 1), dur: 0.3, partials: [1, 2, 3], gains: [1, 0.5, 0.25] });
      gem(ctx, out, t + 0.14, { f: note(3, 1), dur: 0.35, g: 0.93, partials: [1, 2, 3], gains: [1, 0.5, 0.25] });
    },
  };
  // 每一個都是 (ctx, out, t, noise)，out 已經乘好音量。量測（tools 的離線渲染）也讀這張
  const wear = (fn) => (ctx, out, t, noise) => fn(ctx, out, t, 1, noise);
  const CMP = window.__cmp = {
    'cloth 舊': [0.4, wear(OLD.cloth)], 'cloth 新': [0.4, wear(MAT.cloth)],
    'paper 舊': [0.4, wear(OLD.paper)], 'paper 新': [0.4, wear(MAT.paper)],
    'confirm 舊': [LEVEL.confirm, OLD.confirm], 'confirm A 實物寶石': [LEVEL.confirm, (c, o, t, n) => UI.confirm(c, o, t, 0, n)], 'seal B 蓋印': [LEVEL.seal, (c, o, t, n) => UI.seal(c, o, t, 0, n)],
  };
  for (const [name, [vol, fn]] of Object.entries(CMP)) {
    const b = document.createElement('button');
    b.innerHTML = `${name}<small>${name.includes('舊') ? '原本的' : '現在遊戲裡的'}</small>`;
    b.onclick = () => { amb.start(); fn(amb.ctx, amb.out(vol, 0), amb.ctx.currentTime + 0.02, amb.noise); log(name); };
    $('cmp').appendChild(b);
  }
  for (const k of Object.keys(MAT)) {
    const b = document.createElement('button');
    b.innerHTML = `${k}<small>VOL 0.4</small>`;
    b.onclick = () => { amb.start(); mat(k); log('MAT ' + k); };
    $('mats').appendChild(b);
  }

  for (const z of Object.keys(ROOT)) { const o = document.createElement('option'); o.value = z; o.textContent = `${z} ${ROOT[z]} Hz`; $('zone').appendChild(o); }
  $('zone').onchange = () => setZone($('zone').value);
  const level = () => { amb.gain = +$('gain').value * ($('coarse').checked ? 0.7 : 1); $('gainV').textContent = (+$('gain').value).toFixed(2); };
  $('coarse').onchange = level;
  $('gain').oninput = level;
  const bind = (id, key) => { $(id).oninput = () => { TUNE[key] = +$(id).value; $(id + 'V').textContent = (+$(id).value).toFixed(2); }; };
  bind('pitch', 'pitch');
  bind('length', 'length');
</script>
</body>
</html>
