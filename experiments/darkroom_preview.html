     洗的引擎跟遊戲同一支（darkroom.js），看到的就是師傅洗出來的。用 http://localhost:8000/experiments/darkroom_preview.html 打開；?demo 自己生三張假照片。只做電腦版 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暗房調色台</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>
  :root { --bg: #17120e; --panel: #201913; --line: rgba(232, 184, 106, .22); --line-soft: rgba(232, 184, 106, .1); --gold: #e8b86a; --gold-hi: #f6dba6; --text: #efe3cf; --muted: #a8977c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: #2a211a; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--gold); }
  button.on { background: #4a3618; border-color: var(--gold); color: var(--gold-hi); }
  button.primary { background: #5a4220; border-color: var(--gold); color: var(--gold-hi); }
  button:disabled { opacity: .45; cursor: default; }
  select, input[type=text] { background: #15100c; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); height: 46px; }
  #bar b { color: var(--gold-hi); font-size: 15px; margin-right: 4px; }
  #bar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #bar #info { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: flex; height: calc(100% - 46px); }
  #stage { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #view { flex: 1 1 auto; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #0e0b08; overflow: hidden; }
  #view.zoom { display: block; overflow: auto; }
  #view[hidden], #gridview[hidden] { display: none; }
  #gl { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
  #view.zoom #gl { max-width: none; max-height: none; }
  #splitwrap { position: absolute; pointer-events: none; }
  #splitline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid rgba(255, 255, 255, .75); box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); }
  #hint { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; color: var(--muted); pointer-events: none; font-size: 15px; }
  #view.drop::after { content: "放開就收進來"; position: absolute; inset: 12px; border: 2px dashed var(--gold); border-radius: 10px; display: grid; place-items: center; color: var(--gold-hi); font-size: 18px; background: rgba(23, 18, 14, .6); }
  #gridview { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 10px; padding: 10px; background: #0e0b08; align-content: start; }
  #gridview figure { margin: 0; cursor: pointer; }
  #gridview canvas { display: block; width: 100%; height: auto; border-radius: 4px; }
  #gridview figcaption { color: var(--muted); font-size: 12px; padding: 3px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #strip { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--panel); overflow-x: auto; min-height: 84px; }
  #strip .th { position: relative; flex: 0 0 auto; width: 96px; height: 64px; padding: 0; border-radius: 4px; overflow: hidden; background: #000; border: 2px solid transparent; }
  #strip .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #strip .th.on { border-color: var(--gold); }
  #strip .th span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; line-height: 1.3; padding: 1px 4px; background: rgba(0, 0, 0, .55); color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  #strip .th i { position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; font: 12px/16px sans-serif; text-align: center; font-style: normal; display: none; }
  #strip .th:hover i { display: block; }
  #strip .th small { position: absolute; left: 3px; top: 2px; font-size: 9px; color: var(--gold-hi); background: rgba(0, 0, 0, .55); padding: 0 3px; border-radius: 3px; }
  #strip #open { flex: 0 0 auto; height: 64px; }
  #strip .note { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #side { flex: 0 0 392px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; overflow-x: hidden; }
  #hist { width: 100%; height: 120px; display: block; background: #110d0a; border-bottom: 1px solid var(--line); }
  details { border-bottom: 1px solid var(--line-soft); }
  summary { cursor: pointer; padding: 7px 12px; color: var(--gold); font-weight: 600; user-select: none; list-style: none; display: flex; align-items: center; gap: 6px; }
  summary::before { content: "▸"; font-size: 11px; color: var(--muted); }
  details[open] summary::before { content: "▾"; }
  summary .mini { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--muted); }
  .body { padding: 2px 12px 10px; }
  .row { display: grid; grid-template-columns: 76px 1fr 54px; align-items: center; gap: 8px; height: 26px; }
  .row label { color: var(--muted); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row label:hover { color: var(--text); }
  .row.changed label { color: var(--gold-hi); }
  .row input[type=range] { width: 100%; height: 18px; margin: 0; accent-color: var(--gold); cursor: pointer; }
  .row input[type=range].temp { background: linear-gradient(90deg, #3c6fd6, #999, #e9b43c); border-radius: 3px; height: 4px; appearance: none; }
  .row input[type=range].tint { background: linear-gradient(90deg, #3cb04a, #999, #d548c9); border-radius: 3px; height: 4px; appearance: none; }
  .row input[type=range].temp::-webkit-slider-thumb, .row input[type=range].tint::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold-hi); border: 1px solid #000; }
  .row input[type=number] { width: 54px; background: #15100c; border: 1px solid var(--line-soft); border-radius: 4px; padding: 1px 4px; text-align: right; font-variant-numeric: tabular-nums; }
  .row input[type=number]::-webkit-inner-spin-button { opacity: .4; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .tabs { display: flex; gap: 4px; margin: 2px 0 6px; }
  .tabs button { padding: 2px 9px; font-size: 12px; border-radius: 10px; }
  .toggle { display: flex; gap: 6px; margin: 4px 0; align-items: center; }
  .toggle span { color: var(--muted); width: 76px; }
  #curve { display: block; width: 256px; height: 256px; background: #110d0a; border: 1px solid var(--line-soft); border-radius: 4px; cursor: crosshair; margin: 4px auto; outline: none; }
  #curve:focus { border-color: var(--gold); }
  .curvehelp { color: var(--muted); font-size: 11px; text-align: center; }
  .wheels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wheel { text-align: center; }
  .wheel h4 { margin: 0 0 4px; font-weight: 400; color: var(--muted); font-size: 12px; }
  .wheel canvas { display: block; width: 100px; height: 100px; margin: 0 auto; border-radius: 50%; cursor: crosshair; }
  .wheel .val { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; height: 16px; }
  .wheel .row { grid-template-columns: 1fr 44px; height: 22px; margin-top: 2px; }
  #recipe { width: 100%; height: 190px; resize: vertical; background: #110d0a; border: 1px solid var(--line-soft); border-radius: 4px; color: #d9c9a8; font: 11px/1.45 ui-monospace, Consolas, monospace; padding: 6px; white-space: pre; overflow: auto; }
  #toast { position: fixed; left: 16px; bottom: 100px; background: rgba(40, 30, 20, .95); border: 1px solid var(--gold); color: var(--gold-hi); padding: 8px 14px; border-radius: 8px; z-index: 9; pointer-events: none; transition: opacity .3s; }
  #toast[hidden] { display: block; opacity: 0; }
  kbd { font: 11px ui-monospace, monospace; background: #2a211a; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<header id="bar">
  <b>暗房調色台</b>
  <select id="lab" title="哪一位師傅的配方"></select>
  <label>風格 <input type="text" id="style" size="5" title="相簿裡照片角落寫的字"></label>
  <span class="sep"></span>
  <button id="copy" class="primary" title="整段複製，貼回 js/camera/darkroom.js 的 LABS">複製配方</button>
  <button id="paste" title="貼 LABS 的一段、COLORAWA 的 .rawapreset 內容、或純設定 JSON">貼上</button>
  <button id="file" title="COLORAWA 存的 .rawapreset 或 .json">載入調色檔</button><input type="file" id="fileIn" accept=".rawapreset,.json,application/json" hidden>
  <button id="revert" title="丟掉草稿，回到 darkroom.js 檔案裡寫的">回到檔案裡的</button>
  <button id="reset" title="全部歸零（不調色）">全部歸零</button>
  <span class="sep"></span>
  <button id="before" title="按住看原片，鍵盤 B 也行">原片</button>
  <button id="split" title="左邊原片、右邊洗好的，拖分界線">對切</button>
  <button id="zoom" title="看實際像素（顆粒、質感要這樣看）">1:1</button>
  <button id="grid" title="收進來的照片全部用這個配方一起看">同看</button>
  <span id="info"></span>
</header>
<main>
  <section id="stage">
    <div id="view">
      <canvas id="gl"></canvas>
      <div id="splitwrap" hidden><div id="splitline"></div></div>
      <div id="hint">把照片丟進來，或按下面的「打開檔案」。相簿裡還沒洗的照片會自己出現</div>
    </div>
    <div id="gridview" hidden></div>
    <div id="strip">
      <button id="open">＋ 打開檔案</button><input type="file" id="openIn" accept="image/*" multiple hidden>
      <span class="note" id="stripnote"></span>
    </div>
  </section>
  <aside id="side">
    <canvas id="hist" width="784" height="240"></canvas>
    <div id="panels"></div>
    <details id="out" open><summary>貼回 LABS 的樣子</summary><div class="body"><textarea id="recipe" readonly spellcheck="false"></textarea></div></details>
  </aside>
</main>
<div id="toast" hidden></div>
<script type="module">
  import { Darkroom, DEFAULTS, LABS, HSL_KEYS, fullSettings, trimSettings, formatRecipe, curveLUT, hasWebGL2, develop } from '../js/camera/darkroom.js';
  import { loadAlbum, album } from '../js/camera/album.js';

  const $ = (s) => document.querySelector(s);
  const P = new URLSearchParams(location.search);
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const get = (o, path) => path.split('.').reduce((a, k) => a[k], o);
  const set = (o, path, v) => { const ks = path.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let toastT;
  const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); };

  if (!hasWebGL2()) { $('#hint').textContent = '這個瀏覽器沒有 WebGL2，開不了暗房'; throw new Error('no webgl2'); }

  // ───────── 師傅們：檔案裡的 LABS 加上這台存的草稿（新加的師傅也存在草稿裡） ─────────
  const DRAFT = 'darkroom-draft:';
  const labs = {};
  for (const [id, L] of Object.entries(LABS)) labs[id] = { name: L.name, who: L.who, style: L.style, settings: fullSettings(L.settings) };
  const drafted = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k?.startsWith(DRAFT)) continue;
    try {
      const d = JSON.parse(localStorage.getItem(k)), id = k.slice(DRAFT.length);
      labs[id] = { name: d.name ?? labs[id]?.name ?? id, who: d.who ?? labs[id]?.who ?? '', style: d.style ?? labs[id]?.style ?? '', settings: fullSettings(d.settings || {}) };
      drafted.push(id);
    } catch {}
  }
  let labId = Object.keys(labs)[0], S = labs[labId].settings;

  // ───────── 引擎、照片 ─────────
  const engine = new Darkroom($('#gl'));
  const gridEngine = new Darkroom();   // 同看用，自己一張畫布
  const photos = [];                   // { name, bitmap, small, url, from }
  let cur = null, view = 0, split = 0.5, gridOn = false, holding = false;

  async function addPhoto(blob, name, from) {
    let bitmap;
    try { bitmap = await createImageBitmap(blob); } catch { toast(`讀不了 ${name}`); return null; }
    const k = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
    const small = k < 1 ? await createImageBitmap(bitmap, { resizeWidth: Math.round(bitmap.width * k), resizeHeight: Math.round(bitmap.height * k), resizeQuality: 'high' }) : bitmap;
    const p = { name, bitmap, small, url: URL.createObjectURL(blob), from };
    photos.push(p);
    const b = el('button', 'th');
    const img = new Image();
    img.src = p.url;
    img.alt = '';
    b.append(img, el('span', '', name));
    if (from) b.append(el('small', '', from));
    const x = el('i', '', '×');
    x.title = '拿掉';
    b.append(x);
    b.onclick = (e) => (e.target === x ? remove(p) : select(p));
    p.el = b;
    $('#strip').insertBefore(b, $('#open'));
    stripNote();
    if (!cur) select(p);
    else if (gridOn) scheduleGrid();
    return p;
  }
  function remove(p) {
    const i = photos.indexOf(p);
    if (i < 0) return;
    photos.splice(i, 1);
    p.el.remove();
    URL.revokeObjectURL(p.url);
    if (cur === p) { cur = null; if (photos.length) select(photos[Math.min(i, photos.length - 1)]); else { $('#hint').hidden = false; engine.release(); $('#info').textContent = ''; } }
    stripNote();
    if (gridOn) scheduleGrid();
  }
  function stripNote() { $('#stripnote').textContent = photos.length ? '' : '也可以把圖檔直接拖進畫面'; }
  function select(p) {
    cur = p;
    for (const q of photos) q.el.classList.toggle('on', q === p);
    engine.setImage(p.bitmap);
    $('#hint').hidden = true;
    $('#info').textContent = `${p.name}　${p.bitmap.width}×${p.bitmap.height}`;
    applyZoom();
    invalidate();
  }
  // 1:1 是照片一個像素對螢幕一個像素（高解析螢幕 CSS 的 px 要除掉）
  function applyZoom() {
    const on = $('#view').classList.contains('zoom');
    $('#gl').style.width = on && cur ? cur.bitmap.width / (devicePixelRatio || 1) + 'px' : '';
  }

  // ───────── 畫 ─────────
  let dirty = false, histT = 0, recipeT = 0, draftT = 0, gridT = 0;
  function invalidate() { if (dirty) return; dirty = true; requestAnimationFrame(frame); }
  function frame() {
    dirty = false;
    if (!cur) return;
    engine.render(S, { view: holding ? 1 : view, split });
    placeSplit();
    if (!histT) histT = setTimeout(() => { histT = 0; drawHist(); }, 70);
    if (!recipeT) recipeT = setTimeout(() => { recipeT = 0; showRecipe(); }, 150);
    clearTimeout(draftT);
    draftT = setTimeout(saveDraft, 500);
    if (gridOn) scheduleGrid();
  }
  function scheduleGrid() { clearTimeout(gridT); gridT = setTimeout(drawGrid, 120); }
  function drawGrid() {
    const g = $('#gridview');
    if (!gridOn) return;
    for (const p of photos) {
      if (!p.cell) {
        const f = el('figure'), c = el('canvas');
        f.append(c, el('figcaption', '', p.name));
        f.onclick = () => { select(p); $('#grid').click(); };
        p.cell = f;
        p.cellCanvas = c;
      }
      if (p.cell.parentNode !== g) g.append(p.cell);
      gridEngine.setImage(p.small);
      gridEngine.render(S);
      const c = p.cellCanvas;
      if (c.width !== p.small.width || c.height !== p.small.height) { c.width = p.small.width; c.height = p.small.height; }
      c.getContext('2d').drawImage(gridEngine.canvas, 0, 0);
    }
    for (const f of [...g.children]) if (!photos.some((p) => p.cell === f)) f.remove();
    gridEngine.release();
  }
  let lastHist = null;
  function drawHist() {
    const h = cur && engine.histogram(S);
    lastHist = h;
    const c = $('#hist'), ctx = c.getContext('2d'), W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    if (!h) { curve?.draw(); return; }
    // 最高的格子不算 0 和 255（剪掉的那兩根會把別的壓扁）
    let max = 1;
    for (let i = 1; i < 255; i++) max = Math.max(max, h.r[i], h.g[i], h.b[i]);
    const area = (arr, fill) => {
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let i = 0; i < 256; i++) ctx.lineTo(i / 255 * W, H - Math.min(1, arr[i] / max) * (H - 8));
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    };
    ctx.globalCompositeOperation = 'lighter';
    area(h.r, 'rgba(230, 70, 60, .55)');
    area(h.g, 'rgba(70, 200, 90, .5)');
    area(h.b, 'rgba(70, 110, 240, .55)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255, 245, 225, .7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 256; i++) ctx[i ? 'lineTo' : 'moveTo'](i / 255 * W, H - Math.min(1, h.l[i] / max) * (H - 8));
    ctx.stroke();
    // 兩端剪掉多少
    const n = 128 * 128, lo = h.l[0] / n, hi = h.l[255] / n;
    ctx.fillStyle = 'rgba(232, 184, 106, .8)';
    ctx.font = '20px sans-serif';
    if (lo > 0.002) ctx.fillText(`黑 ${(lo * 100).toFixed(1)}%`, 10, 26);
    if (hi > 0.002) { const t = `白 ${(hi * 100).toFixed(1)}%`; ctx.fillText(t, W - 10 - ctx.measureText(t).width, 26); }
    curve?.draw();
  }
  function placeSplit() {
    const wrap = $('#splitwrap');
    wrap.hidden = view !== 2 || holding || !cur;
    if (wrap.hidden) return;
    const r = $('#gl').getBoundingClientRect(), v = $('#view').getBoundingClientRect();
    Object.assign(wrap.style, { left: r.left - v.left + $('#view').scrollLeft + 'px', top: r.top - v.top + $('#view').scrollTop + 'px', width: r.width + 'px', height: r.height + 'px' });
    $('#splitline').style.left = split * 100 + '%';
  }

  // ───────── 歷史（Ctrl+Z / Ctrl+Y）、草稿 ─────────
  const undos = [], redos = [];
  let snap = JSON.stringify(S);
  function commit() {
    const now = JSON.stringify(S);
    if (now === snap) return;
    undos.push(snap);
    if (undos.length > 120) undos.shift();
    redos.length = 0;
    snap = now;
  }
  function replace(settings) {
    labs[labId].settings = S = fullSettings(settings);
    snap = JSON.stringify(S);
    refreshAll();
    invalidate();
  }
  function undo() { if (!undos.length) return; redos.push(JSON.stringify(S)); replace(JSON.parse(undos.pop())); }
  function redo() { if (!redos.length) return; undos.push(JSON.stringify(S)); replace(JSON.parse(redos.pop())); }
  function saveDraft() {
    const L = labs[labId];
    try { localStorage.setItem(DRAFT + labId, JSON.stringify({ name: L.name, who: L.who, style: L.style, settings: trimSettings(S) })); } catch {}
  }
  function showRecipe() {
    const L = labs[labId];
    $('#recipe').value = formatRecipe(labId, { ...L, settings: S });
  }

  // ───────── 面板 ─────────
  const refreshers = [];
  function refreshAll() { for (const f of refreshers) f(); }
  function panel(title, open = true, mini = '') {
    const d = el('details'), s = el('summary', '', title);
    d.open = open;
    if (mini) s.append(el('span', 'mini', mini));
    d.append(s);
    const body = el('div', 'body');
    d.append(body);
    $('#panels').append(d);
    return body;
  }
  // 一條滑桿：拉的時候即時畫，放開記一步；滾輪一格一步；點兩下名字歸零
  function slider(parent, path, label, min, max, step = 1, cls = '') {
    const row = el('div', 'row'), lab = el('label', '', label), range = el('input'), num = el('input');
    range.type = 'range';
    range.min = min; range.max = max; range.step = step;
    if (cls) range.className = cls;
    num.type = 'number';
    num.min = min; num.max = max; num.step = step;
    const dflt = get(DEFAULTS, path);
    const show = () => { const v = get(S, path); range.value = v; num.value = step < 1 ? (+v).toFixed(2) : v; row.classList.toggle('changed', v !== dflt); };
    range.oninput = () => { set(S, path, +range.value); show(); invalidate(); };
    range.onchange = () => commit();

    }
    const grey = g.createLinearGradient(0, 0, w, 0);
    for (let i = 0; i <= 10; i++) grey.addColorStop(i / 10, `rgb(${i * 25.5} ${i * 25.5} ${i * 25.5})`);
    g.fillStyle = grey;
    g.fillRect(0, h * 0.92, w, h * 0.08);
    const d = g.getImageData(0, 0, w, h);
    for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - 0.5) * 10; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; }
    g.putImageData(d, 0, 0);
    return new Promise((res) => c.toBlob(res, 'image/jpeg', 0.92));
  }
  const ready = (async () => {
    if (P.has('demo')) {
      const list = [[1920, 1080, 0], [1920, 1080, 1], [1080, 1920, 2]];
      for (const [i, [w, h, k]] of list.entries()) await addPhoto(await fakePhoto(w, h, k), `假照片-${['夕陽', '藍夜', '月球'][k]}.jpg`, '假');
    }
    try {
      await loadAlbum();
      for (const it of album()) if (!it.kind && it.state !== 'back' && it.blob) await addPhoto(it.blob, it.name, it.state === 'lab' ? '取件單' : it.film ? '底片' : '相簿');
    } catch {}
  })();

  fillLabs();
  switchLab(labId);
  if (drafted.length) toast(`載入了上次的草稿（${drafted.join('、')}）；「回到檔案裡的」可以丟掉`);
  // 無頭測試用
  window.__dark = { engine, labs, LABS, photos, develop, ready, get S() { return S; }, get cur() { return cur; }, replace, trimSettings, parseRecipe, applyRecipe, formatRecipe };
</script>
