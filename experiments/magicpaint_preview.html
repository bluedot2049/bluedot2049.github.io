<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色塊畫測試</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>
  body { margin: 0; background: #1c130d; color: #e8dcc8; font: 13px sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; background: rgba(28, 19, 13, 0.82); padding: 10px 12px; border: 1px solid #6b4a2e; border-radius: 6px; line-height: 1.9; }
  #ui button { background: #3a2a1e; color: #e8dcc8; border: 1px solid #8a6a42; border-radius: 4px; padding: 2px 8px; margin-right: 4px; cursor: pointer; }
  #ui button.on { background: #8a6a42; color: #1c130d; }
  #stat { font: 12px monospace; color: #c8b090; }
</style>
</head>
<body>
<div id="ui">
  <div><button id="auto" class="on">自動走</button><button id="wake">全醒</button><button id="sleep">全睡</button></div>
  <div>景深 <input id="depth" type="range" min="0" max="2" step="0.05" value="1"> <span id="dv">1.00</span></div>
  <div>自己走：← → 沿牆，↑ ↓ 遠近（或拖曳）</div>
  <div id="stat"></div>
</div>
<script type="module">
  // 色塊畫測試：一面牆四幅，鏡頭沿牆走，第二、四幅前面停下來看甦醒。?seed=字 換一批構圖
  import * as THREE from 'three';
  import { uTime } from '../js/core/scenery.js';
  import { createMagicPaint, paletteFor, updateMagic, bakeOne, DEPTH_K } from '../js/zones/gallery/magicpaint.js';

  const q = new URLSearchParams(location.search), salt = q.get('seed') || '';
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1c130d);
  scene.fog = new THREE.Fog(0x1c130d, 16, 38);
  scene.add(new THREE.HemisphereLight(0xfff0dc, 0x6a4a34, 1.9));
  const sun = new THREE.DirectionalLight(0xffcf98, 1.3);
  sun.position.set(4, 8, 3);
  scene.add(sun);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);

  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 3.2), new THREE.MeshLambertMaterial({ color: 0x6b4a3a }));
  wall.position.set(0, 1.6, 0);
  scene.add(wall);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshLambertMaterial({ color: 0x4a3222 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.z = 5;
  scene.add(floor);

  const LIST = [
    { title: '作品三', room: 'Nigredo', w: 50, h: 70, x: -7 },
    { title: '作品四', room: 'Nigredo', w: 70, h: 50, x: -2.5 },
    { title: '作品五', room: 'Rubedo', w: 100, h: 120, x: 2.5 },
    { title: '作品六', room: 'Citrinitas', w: 60, h: 60, x: 7 },
  ];
  const frameMat = new THREE.MeshLambertMaterial({ color: 0x5a3a22 });
  const paints = LIST.map((d) => {
    const w = d.w / 100 * 1.5, h = d.h / 100 * 1.5, cy = Math.max(1.5, h / 2 + 0.65);
    const p = createMagicPaint({ seed: d.title + salt, palette: paletteFor(d.room), w, h });
    const g = new THREE.Group();
    const back = new THREE.Mesh(new THREE.BoxGeometry(w + 0.14, h + 0.14, 0.06), frameMat);
    back.position.z = 0.04;
    g.add(back);
    // 畫框的唇凸在畫布前面，壓住畫布邊，看起來像窗框
    for (const [sx, sy, bw, bh] of [[0, 1, w + 0.14, 0.07], [0, -1, w + 0.14, 0.07], [1, 0, 0.07, h], [-1, 0, 0.07, h]]) {
      const lip = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.05), frameMat);
      lip.position.set(sx * (w / 2 + 0.035 - 0.02), sy * (h / 2 + 0.035 - 0.02), 0.1);
      g.add(lip);
    }
    const canvas = new THREE.Mesh(new THREE.PlaneGeometry(w, h), p.material);
    canvas.position.z = 0.075;
    g.add(canvas);
    g.position.set(d.x, cy, 0.02);
    scene.add(g);
    p.mesh = canvas;
    p.want = true;
    p.x = d.x;
    return p;
  });

  // 自動走：沿牆來回，第二、四幅前面停 6 秒
  const STOPS = [paints[1].x, paints[3].x];
  let auto = true, ax = -10, dir = 1, wait = 0, z = 3.2, manual = { x: -4, z: 3.2 };
  const keys = {};
  addEventListener('keydown', (e) => { keys[e.key] = true; });
  addEventListener('keyup', (e) => { keys[e.key] = false; });
  let drag = null;
  addEventListener('pointerdown', (e) => { if (!e.target.closest('#ui')) drag = { x: e.clientX, y: e.clientY }; });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    setAuto(false);
    manual.x -= (e.clientX - drag.x) * 0.01;
    manual.z = Math.min(6, Math.max(0.8, manual.z + (e.clientY - drag.y) * 0.01));
    drag = { x: e.clientX, y: e.clientY };
  });
  const $ = (id) => document.getElementById(id);
  function setAuto(on) { auto = on; $('auto').classList.toggle('on', on); if (!on) manual.x = pos.x; }
  $('auto').onclick = () => setAuto(!auto);
  $('wake').onclick = () => paints.forEach((p) => { p.wake = 1; p.seen = true; });
  $('sleep').onclick = () => paints.forEach((p) => { p.wake = 0; p.seen = false; });
  $('depth').oninput = (e) => { DEPTH_K.value = +e.target.value; $('dv').textContent = (+e.target.value).toFixed(2); };

  const pos = new THREE.Vector3(ax, 0, z), last = new THREE.Vector3().copy(pos), eye = new THREE.Vector3();
  let prev = performance.now(), acc = 0, frames = 0, worst = 0, bakeMs = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;
    uTime.value += dt;
    const t0 = performance.now();
    if (bakeOne(paints)) bakeMs = Math.max(bakeMs, performance.now() - t0);

    if (auto) {
      if (wait > 0) wait -= dt;
      else {
        const nx = ax + dir * 1.2 * dt;
        for (const s of STOPS) if ((ax - s) * (nx - s) <= 0 && ax !== s) wait = 6;
        ax = nx;
        if (ax > 10 || ax < -10) dir = -dir;
      }
      pos.set(ax, 0, z);
    } else {
      if (keys.ArrowLeft) manual.x -= 2 * dt;
      if (keys.ArrowRight) manual.x += 2 * dt;
      if (keys.ArrowUp) manual.z = Math.max(0.8, manual.z - 2 * dt);
      if (keys.ArrowDown) manual.z = Math.min(6, manual.z + 2 * dt);
      pos.set(manual.x, 0, manual.z);
    }
    const speed = pos.distanceTo(last) / Math.max(dt, 1e-4);
    last.copy(pos);
    eye.set(pos.x, 1.6, pos.z);
    camera.position.copy(eye);
    camera.lookAt(pos.x + (auto ? dir * 0.6 : 0), 1.55, 0);

    const t1 = performance.now();
    updateMagic(paints, dt, eye, pos, speed);
    const cpu = performance.now() - t1;
    renderer.render(scene, camera);

    acc += dt; frames++; worst = Math.max(worst, dt);
    if (acc > 0.5) {
      $('stat').textContent = `${(frames / acc).toFixed(0)} fps　最慢一幀 ${(worst * 1000).toFixed(1)} ms　每幀更新 ${(cpu * 1000).toFixed(0)} µs　烤一幅最久 ${bakeMs.toFixed(1)} ms　繪製 ${renderer.info.render.calls} 次\n醒：${paints.map((p) => p.wake.toFixed(2)).join(' ')}`;
      acc = 0; frames = 0; worst = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });
  window.__mp = { paints, camera, renderer, scene, setAuto, manual, uTime };
</script>
</body>
</html>
