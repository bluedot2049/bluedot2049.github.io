<html lang="zh-Hant-TW">

<head>

  <title>黑森林地下洞穴大型裝飾物 — 1:1 標本場</title>
  <style>
    * { box-sizing: border-box; }

      margin: 0;
      height: 100%;

    .bar {

<body>
  <div class="note" id="info"></div>
  <div class="bar">
    <button data-item="all" class="on">全覽（一～五層洞穴 6 件）</button>
    <button data-item="0">1 一層：絞盤礦車架</button>
    <button data-item="1">2 二層：切石骨龕燭台</button>
    <button data-item="2">3 三層：木砦薩滿柱</button>
    <button data-item="3">4 四層：濕黑溶岩骨灘</button>
    <button data-item="4">5 五層：古代金箔祭器</button>
    <button data-item="5">6 跨層：深溝斷橋絞錨</button>
    <span class="sep"></span>
    <button id="btnTorch">洞穴火把掃光</button>
    <button id="btnCompare">對照：預設 vs 這裡</button>
    <button id="btnForm">灰泥 (-form)</button>
    <button id="btnWire">線框</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Kit, newBucket, mergeBucket, rng } from '../js/core/props.js';
    import { uTime } from '../js/core/scenery.js';
    import { Character } from '../js/avatar/character.js';
    import { sanitizeLook } from '../js/avatar/looks.js';

    const params = new URLSearchParams(location.search);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const BG_NORMAL = new THREE.Color(0x0d0e12);
    const BG_TORCH = new THREE.Color(0x050507);
    const BG_FORM = new THREE.Color(0x949ea8);
    const scene = new THREE.Scene();
    scene.background = BG_NORMAL.clone();

    const hemi = new THREE.HemisphereLight(0xc8d8e8, 0x262022, 1.32);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffe2be, 1.18);
    sun.position.set(5.2, 8.0, 5.8);
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0x6e8cb4, 0.42);
    rim.position.set(-5.0, 3.2, -4.5);
    scene.add(rim);

    // 洞穴模式專用動態點光（模擬隊友手舉火把與法師光球掃過切面）
    const torchLight = new THREE.PointLight(0xff9438, 0, 12.5, 1.35);
    scene.add(torchLight);
    const torchOrb = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.08, 0),
      new THREE.MeshBasicMaterial({ color: 0xffb852 })
    );
    torchOrb.visible = false;
    scene.add(torchOrb);

    const mageLight = new THREE.PointLight(0x74b8ff, 0, 9.0, 1.5);
    scene.add(mageLight);

    // ── 共用材質：普通吃光（Lambert）、自發光（火／鬼火）、濕黑反光岩與皺金箔（Phong） ──
    const matLit = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
    const matGlow = new THREE.MeshBasicMaterial({ vertexColors: true });
    const matWet = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, specular: 0x7a96ac, shininess: 38 });
    const matFoil = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, specular: 0xffe4a0, shininess: 76 });
    const matForm = new THREE.MeshLambertMaterial({ color: 0xcfc8bc, flatShading: true });
    const matWire = new THREE.MeshBasicMaterial({ color: 0xffe09a, wireframe: true, transparent: true, opacity: 0.28 });

    // ── 對齊 dong.js PAL[0..4] 五層岩色 ＋ 黑森林洞穴共用材質色票 ──
    const LAYER_ROCK = [
      ['#34312f', '#76716b'], // 一層：冷灰礦坑岩
      ['#2c2f33', '#6f737a'], // 二層：灰藍古墓切石
      ['#3a2620', '#8c5c46'], // 三層：紅褐裂谷岩
      ['#15181c', '#4c5662'], // 四層：濕黑帶藍巨魔岩
      ['#4a4036', '#b2a388'], // 五層：淡砂岩古代大廳
    ];
    const WOOD = '#4a3626', WOOD_HI = '#6e523a', FIR = '#33251c', FIR_HI = '#564030';
    const RED = '#5e221c', RED_HI = '#843026', BONE = '#b3a891', BONE_HI = '#cfc3a8';
    const IRON = '#292727', IRON_HI = '#4e4b49', STEEL = '#646a72', STEEL_HI = '#9aa1aa';
    const HEMP = '#8c7a5c', HEMP_HI = '#b29e7a', BRONZE = '#7a5c32', BRONZE_HI = '#ad8448';
    const GOLD_TIERS = [['#8a5418', '#a06a20'], ['#c07c26', '#d09430'], ['#d49a34', '#ecc050']];

    const _y = new THREE.Vector3(0, 1, 0), _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();

    function aim(axis, dir) {
      _q.setFromUnitVectors(axis, dir.clone().normalize());
      _e.setFromQuaternion(_q, 'YXZ');
      return { rx: _e.x, ry: _e.y, rz: _e.z };
    }

    function rod(k, a, b, r1, r2, c, o = {}, seg = 6) {
      const d = new THREE.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
      k.cyl(r2, r1, d.length(), c, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, { ...o, ...aim(_y, d) }, seg);
    }

    function ring(k, r, tube, c, x, y, z, o = {}, seg = 7, rad = 4, arc = Math.PI * 2) {
      k.add(new THREE.TorusGeometry(r, tube, rad, seg, arc), c, x, y, z, o);
    }

    function bentCyl(k, rt, rb, h, c, x, y, z, o = {}, seg = 7, hSeg = 5) {
      k.add(new THREE.CylinderGeometry(rt, rb, h, seg, hSeg), c, x, y, z, o);
    }

    // 皺金箔（照法線畫出 3 階菱格金箔切面，頂亮底暗）
    function makeFoilBlob(r, sx, sy, sz, wob = 0.04) {
      const g0 = new THREE.IcosahedronGeometry(r, 2);
      const g = g0.index ? g0.toNonIndexed() : g0;
      const pos = g.attributes.position;
      const cols = new Float32Array(pos.count * 3);
      const fr = (v) => ((v % 1) + 1) % 1;
      for (let i = 0; i < pos.count; i++) {
        const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
        const k = 1 + wob * Math.sin(px * 14.3 + py * 63.1 + pz * 31.7);
        pos.setXYZ(i, px * sx * k, py * sy * k, pz * sz * k);
      }
      for (let i = 0; i < pos.count; i += 3) {
        const nx = (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3;
        const ny = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3;
        const nz = (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3;
        const len = Math.hypot(nx, ny, nz) || 1;
        const dx = nx / len, dy = ny / len, dz = nz / len;
        const th = (Math.atan2(dx, dz) / (Math.PI * 2)) * 8;
        const ph = (Math.acos(Math.max(-1, Math.min(1, dy))) / Math.PI) * 4.5;
        const fu = fr(th + ph), fv = fr(th - ph);
        const edge = Math.min(fu, 1 - fu, fv, 1 - fv);
        const [a, b] = edge < 0.09 ? GOLD_TIERS[0] : edge < 0.2 ? GOLD_TIERS[1] : GOLD_TIERS[2];
        const col = new THREE.Color(a).lerp(new THREE.Color(b), (dy + 1) / 2);
        for (let j = 0; j < 3; j++) cols.set([col.r, col.g, col.b], (i + j) * 3);
      }
      g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      g.computeVertexNormals();
      return g;
    }

    function buildGroup(fn, seed = 'cave', ao = true) {
      const k = new Kit(rng(seed)), b = newBucket();
      const wetK = new Kit(rng(seed + '_wet')), wetB = newBucket();
      const foilK = new Kit(rng(seed + '_foil')), foilB = newBucket();
      const extra = fn(k, wetK, foilK) || {};
      k.emit(b, 0, 0, 0);
      wetK.emit(wetB, 0, 0, 0);
      foilK.emit(foilB, 0, 0, 0);

      const g = new THREE.Group();
      let tris = 0, parts = b.lit.length + b.glow.length + wetB.lit.length + foilB.lit.length + (extra.parts || 0);

      const addMerged = (list, mat, role, useAO) => {
        if (!list.length) return;
        const geo = mergeBucket(list, useAO);
        if (!geo) return;
        tris += geo.attributes.position.count / 3;
        const m = new THREE.Mesh(geo, mat);
        m.userData.role = role;
        g.add(m);
      };
      addMerged(b.lit, matLit, 'lit', ao);
      addMerged(b.glow, matGlow, 'glow', false);
      addMerged(wetB.lit, matWet, 'wet', ao);
      addMerged(foilB.lit, matFoil, 'foil', false);

      if (extra.setup) tris += extra.setup(g) || 0;
      g.userData.tris = Math.round(tris);
      g.userData.parts = parts;
      g.userData.tick = extra.tick || null;
      return g;
    }

    // ============================================================================
    // 6 座黑森林地下洞穴大型裝飾物／掩體（補齊 1–5 層未建構物件）
    // ============================================================================
    const ITEMS = [
      {
        id: 'layer1_winch_crates',
        name: '1. 一層礦坑：哥布林絞盤吊架與火藥桶堆',
        zone: '黑森林洞・一層（儲藏間／吊籠走道｜冷灰岩）',
        height: 2.45,
        layerIdx: 0,
        desc: '補齊一層只有通用方塊的木箱、麻袋與吊籠絞車：不對稱朽木雙柱配麻繩斜撐，捲軸吊下一串立臥 90° 交錯粗鐵鏈掛著破鐵柵籠；底座旁擠著歪斜木板補強貨箱、0.7 下沉鼓腹麻袋，與箍上暗紅警告條的火藥桶。',
        build(k) {
          const [rLo, rHi] = LAYER_ROCK[0];
          // 靠背冷灰碎岩堆底座
          k.rock(0.32, rLo, -0.52, 0.16, -0.22, { sx: 1.25, sy: 0.62, color2: rHi });
          k.rock(0.22, rLo, 0.56, 0.12, -0.26, { sx: 1.15, sy: 0.58, color2: rHi });

          // 不對稱朽木絞盤架（右高左矮 5%，帶微斜靠內傾）
          bentCyl(k, 0.056, 0.078, 2.28, WOOD, -0.52, 1.14, -0.08, { lean: [0.06, 0.02], bow: [-0.03, 0, 0.3], color2: WOOD_HI }, 6, 5);
          bentCyl(k, 0.054, 0.080, 2.38, WOOD, 0.50, 1.19, -0.06, { lean: [-0.07, 0.01], bow: [0.025, 0, 0.3], color2: WOOD_HI }, 6, 5);
          // 兩根粗斜撐腳柱＋麻繩捆紮節點
          rod(k, [-0.50, 1.38, -0.08], [-0.82, 0.02, 0.24], 0.044, 0.055, FIR, { color2: FIR_HI }, 5);
          rod(k, [0.49, 1.44, -0.06], [0.76, 0.02, 0.20], 0.042, 0.054, FIR, { color2: FIR_HI }, 5);
          ring(k, 0.072, 0.016, HEMP, -0.49, 1.38, -0.07, { rx: 0.4, color2: HEMP_HI }, 6, 3);
          ring(k, 0.070, 0.016, HEMP, 0.48, 1.44, -0.06, { rx: -0.4, color2: HEMP_HI }, 6, 3);

          // 頂軸捲輪＋右伸曲柄
          rod(k, [-0.62, 2.26, -0.06], [0.64, 2.30, -0.06], 0.052, 0.052, WOOD, { color2: WOOD_HI }, 6);
          k.cyl(0.11, 0.11, 0.38, IRON, 0.02, 2.28, -0.06, { rz: Math.PI / 2, color2: IRON_HI }, 8);
          ring(k, 0.14, 0.018, IRON_HI, 0.21, 2.28, -0.06, { ry: Math.PI / 2 }, 7, 3);
          ring(k, 0.14, 0.018, IRON_HI, -0.17, 2.28, -0.06, { ry: Math.PI / 2 }, 7, 3);
          rod(k, [0.64, 2.30, -0.06], [0.78, 2.08, 0.10], 0.018, 0.018, IRON_HI, {}, 5);
          rod(k, [0.78, 2.08, 0.10], [0.92, 2.08, 0.10], 0.016, 0.016, WOOD_HI, {}, 5);

          // 立臥 90° 交錯鐵鏈垂吊半毀鐵吊籠（底框斜吊於負空間中）
          for (let i = 0; i < 6; i++) {
            ring(k, 0.044, 0.011, IRON_HI, 0.02, 2.16 - i * 0.068, -0.06, { ry: (i % 2) * Math.PI / 2 }, 7, 3);
          }
          // 鐵柵殘籠框（頂鐵環＋四根斜拉鎖柱＋斷裂木底板）
          const cy = 1.38;
          k.box(0.54, 0.04, 0.52, WOOD, 0.02, cy - 0.18, -0.04, { rz: 0.08, rx: -0.06, color2: WOOD_HI });
          k.box(0.56, 0.035, 0.54, IRON, 0.02, cy + 0.30, -0.06, { rz: 0.08, rx: -0.06 });
          for (const [bx, bz] of [[-0.24, -0.22], [0.24, -0.22], [0.24, 0.22], [-0.24, 0.22]]) {
            rod(k, [0.02 + bx, cy - 0.18, -0.04 + bz], [0.02 + bx * 0.9, cy + 0.30, -0.06 + bz * 0.9], 0.016, 0.016, IRON_HI, {}, 4);
            rod(k, [0.02 + bx * 0.9, cy + 0.30, -0.06 + bz * 0.9], [0.02, cy + 0.42, -0.06], 0.014, 0.014, IRON, {}, 4);
          }

          // 地面掩體組：對角斜條木箱＋鼓腹 0.7 重心麻袋＋紅帶油藥桶
          k.box(0.56, 0.52, 0.54, WOOD, -0.34, 0.26, 0.22, { ry: 0.22, color2: WOOD_HI });
          rod(k, [-0.58, 0.04, 0.46], [-0.10, 0.48, 0.50], 0.026, 0.026, FIR_HI, {}, 4); // 箱面 X 補強斜木條
          // 鼓腹麻袋（下寬上束）
          k.cyl(0.11, 0.22, 0.34, HEMP, 0.08, 0.17, 0.36, { sx: 1.25, sz: 0.92, rz: -0.08, color2: HEMP_HI }, 7);
          k.cyl(0.16, 0.09, 0.09, HEMP_HI, 0.10, 0.38, 0.36, {}, 7);
          // 哥布林暗紅條火藥桶
          k.cyl(0.16, 0.15, 0.46, FIR, 0.44, 0.23, 0.24, { ry: -0.2, color2: WOOD_HI }, 8);
          k.cyl(0.168, 0.168, 0.11, RED, 0.44, 0.25, 0.24, { color2: RED_HI }, 8);
          k.cyl(0.17, 0.17, 0.025, IRON_HI, 0.44, 0.40, 0.24, {}, 8);
          k.cyl(0.17, 0.17, 0.025, IRON_HI, 0.44, 0.08, 0.24, {}, 8);
        },
      },

      {
        id: 'layer2_ossuary_shrine',
        name: '2. 二層古墓：切石骨龕拱碑與鍛鐵燭台',
        zone: '黑森林洞・二層（墓室／骨堆長廊｜灰藍切石）',
        height: 2.65,
        layerIdx: 1,
        desc: '補齊二層切石、壁龕骨頭與蠟燭：兩層灰藍切石拱龕一側已崩斷露出參差斷面，龕肚橫陳帶黃灰（#b3a891）長骨與頭骨剪影；龕座階前立著三叉鍛鐵燭台燃三點微燭火，左側斜靠半截斷裂墓碑。',
        build(k) {
          const [rLo, rHi] = LAYER_ROCK[1];
          // 兩級切石階座（灰藍偏冷，底深頂亮）
          k.box(1.24, 0.22, 0.86, rLo, 0, 0.11, 0, { ry: 0.04, color2: rHi });
          k.box(0.96, 0.24, 0.66, rLo, 0, 0.34, -0.04, { ry: 0.04, color2: rHi });

          // 左完整八角石柱（略內收）＋右崩斷參差半柱
          k.cyl(0.14, 0.17, 1.32, rLo, -0.34, 1.12, -0.06, { color2: rHi }, 7);
          k.box(0.36, 0.14, 0.34, rLo, -0.34, 1.84, -0.06, { color2: rHi });
          // 右柱斷裂成 0.75m 矮樁（不等高切面）
          k.cyl(0.15, 0.17, 0.68, rLo, 0.34, 0.80, -0.04, { color2: rHi }, 7);
          k.rock(0.14, rHi, 0.34, 1.16, -0.04, { sx: 1.0, sy: 0.55, rz: 0.35, color2: rLo });
          // 斷落在右下角的石柱殘塊
          k.cyl(0.14, 0.14, 0.42, rLo, 0.62, 0.14, 0.18, { rz: 1.38, ry: 0.5, color2: rHi }, 7);

          // 傾歪的拱龕背牆與斜倒過樑
          k.box(0.84, 1.38, 0.24, '#24272b', -0.04, 1.15, -0.22, { rz: 0.03, color2: rLo });
          k.box(1.06, 0.26, 0.44, rLo, -0.10, 2.00, -0.08, { rz: -0.14, color2: rHi });
          k.cone(0.22, 0.46, rHi, -0.32, 2.34, -0.08, { rz: -0.14, color2: rLo });

          // 龕肚分層石格架＋帶黃灰骨堆（#b3a891）與頭骨剪影（每層骨頭實實在在擱在石架上）
          k.box(0.54, 0.14, 0.24, '#141518', -0.02, 0.54, -0.06, {});
          for (const sy of [0.60, 0.88, 1.10]) {
            k.box(0.56, 0.055, 0.26, rLo, -0.03, sy, -0.06, { color2: rHi });
          }
          for (let i = 0; i < 6; i++) {
            const bx = -0.18 + (i % 3) * 0.16, by = 0.65 + Math.floor(i / 3) * 0.28;
            rod(k, [bx - 0.11, by, -0.02], [bx + 0.11, by + (i % 2 ? 0.03 : -0.02), 0.04], 0.032, 0.028, BONE, { color2: BONE_HI }, 5);
          }
          k.rock(0.11, BONE, -0.04, 1.22, -0.02, { sx: 1.0, sy: 1.15, sz: 0.9, color2: BONE_HI });
          k.box(0.08, 0.035, 0.04, '#18181a', -0.04, 1.19, 0.07, {});

          // 左前斜靠的斷裂古石碑
          k.box(0.38, 0.72, 0.12, rLo, -0.62, 0.34, 0.24, { rx: -0.26, ry: 0.38, rz: 0.16, color2: rHi });

          // 右前階梯立起的三叉鍛鐵燭台（微傾＋三根粗蠟燭＋小點暖火）
          bentCyl(k, 0.022, 0.045, 0.92, IRON, 0.22, 0.88, 0.26, { lean: [0.03, 0.02], color2: IRON_HI }, 6, 4);
          k.cyl(0.14, 0.18, 0.05, IRON_HI, 0.22, 0.48, 0.26, {}, 6);

      {
        title: '一層鎖鏈絞架：直排梯子狀平鏈＋光板方箱 vs 立臥 90° 粗鐵鏈＋斜撐破籠＋紅帶火藥桶',
        bad(k) {
          k.add(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 20), '#7a5230', -0.5, 1.1, 0, { ao: false });
          k.add(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 20), '#7a5230', 0.5, 1.1, 0, { ao: false });
          k.box(1.15, 0.08, 0.12, '#7a5230', 0, 2.22, 0, { ao: false });
          // 躺平沒轉 90° 看起來像梯子
          for (let i = 0; i < 7; i++) {
            ring(k, 0.045, 0.01, '#888888', 0, 2.10 - i * 0.075, 0, { ry: 0, ao: false }, 12, 6);
          }
          k.box(0.55, 0.55, 0.55, '#8a603a', 0, 0.275, 0.1, { ao: false });
        },
        good(k, wetK, foilK) {
          return ITEMS[0].build(k, wetK, foilK);
        },
      },
    ];

    const compareStats = [];
    {
      const ck = new Kit(null), cb = newBucket();
      ck.cyl(4.6, 4.9, 0.16, '#1b1b1f', 0, -0.08, 0, {}, 20);
      COMPARISONS.forEach((_, i) => {
        const cx = (i - 0.5) * 3.6;
        ck.cyl(0.84, 0.88, 0.04, '#3a3d42', cx - 0.84, 0.02, -0.15, {}, 12);
        ck.cyl(0.88, 0.92, 0.045, BRONZE, cx + 0.84, 0.022, 0.15, { color2: BRONZE_HI }, 12);
      });
      ck.emit(cb, 0, 0, 0);
      const bm = new THREE.Mesh(mergeBucket(cb.lit, true), matLit);
      bm.userData.role = 'lit';
      compareRoot.add(bm);

      COMPARISONS.forEach((cmp, i) => {
        const cx = (i - 0.5) * 3.6;
        const badG = buildGroup(cmp.bad, 'cavebad_' + i, false);
        badG.position.set(cx - 0.84, 0.04, -0.15);
        compareRoot.add(badG);

        const goodG = buildGroup(cmp.good, 'cavegood_' + i, true);
        goodG.position.set(cx + 0.84, 0.045, 0.15);
        compareRoot.add(goodG);

        compareStats.push(`${i + 1}. 左（預設）${badG.userData.tris} tris → 右（這裡）${goodG.userData.tris} tris`);
      });
    }

    // ============================================================================
    // 互動與打光切換
    // ============================================================================
    const state = {
      item: params.get('item') || 'all',
      torch: params.get('torch') === '1',
      compare: params.get('compare') === '1',
      form: params.get('form') === '1',
      wire: params.get('wire') === '1',
    };

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.08, 90);
    const target = new THREE.Vector3(-0.35, 1.15, -0.35);
    const goalTarget = target.clone();
    let yaw = 0.08, pitch = 0.24, dist = 12.8, goalDist = 12.8;
    if (params.has('yaw')) yaw = +params.get('yaw');
    if (params.has('pitch')) pitch = +params.get('pitch');

    const infoEl = document.getElementById('info');
    function updateUI() {
      showcaseRoot.visible = !state.compare;
      compareRoot.visible = state.compare;

      if (state.form) {
        scene.background = BG_FORM;
        hemi.intensity = 1.15;
        sun.intensity = 1.15;
        rim.intensity = 0.35;
        torchLight.intensity = 0;
        mageLight.intensity = 0;
        torchOrb.visible = false;
      } else if (state.torch) {
        scene.background = BG_TORCH;
        hemi.intensity = 0.20;
        sun.intensity = 0.12;
        rim.intensity = 0.24;
        torchLight.intensity = 4.2;
        mageLight.intensity = 1.6;
        torchOrb.visible = true;
      } else {
        scene.background = BG_NORMAL;
        hemi.intensity = 1.32;
        sun.intensity = 1.18;
        rim.intensity = 0.42;
        torchLight.intensity = 0;
        mageLight.intensity = 0;
        torchOrb.visible = false;
      }

      scene.traverse((o) => {
        if (!o.isMesh) return;
        if (o.userData.role === 'lit') o.material = state.form ? matForm : matLit;
        if (o.userData.role === 'wet') o.material = state.form ? matForm : matWet;
        if (o.userData.role === 'foil') o.material = state.form ? matForm : matFoil;
        if (o.userData.role === 'glow') o.material = state.form ? matForm : matGlow;
        if (o.userData.isWire) o.visible = state.wire;
      });

      document.getElementById('btnTorch').classList.toggle('on', state.torch);
      document.getElementById('btnCompare').classList.toggle('on', state.compare);
      document.getElementById('btnForm').classList.toggle('on', state.form);
      document.getElementById('btnWire').classList.toggle('on', state.wire);

      for (const b of document.querySelectorAll('[data-item]')) {
        b.classList.toggle('on', !state.compare && b.dataset.item === String(state.item));
      }

      if (state.compare) {
        goalTarget.set(0, 1.28, 0);
        goalDist = 8.4;
        infoEl.innerHTML = `<strong>黑森林洞穴 1:1 對照模式：左灰墊「預設做法」 vs 右銅墊「洞裡做法」</strong><br>` +
          `1. 骨龕燭台：24 段光圓柱＋純白球 vs 參差斷石柱＋#b3a891 骨堆＋鍛鐵三叉微燭。<br>` +
          `2. 鎖鏈絞架：沒轉 90° 的梯子狀平鏈＋方塊 vs 立臥交錯粗鐵鏈＋破鐵籠＋紅條火藥桶。` +
          `<div class="meta">${compareStats.join('　｜　')}</div>`;
      } else if (state.item === 'all') {
        goalTarget.set(-0.35, 1.15, -0.35);
        goalDist = 12.8;
        const totalTris = ITEMS.reduce((s, it) => s + it.tris, 0);
        infoEl.innerHTML = `<strong>黑森林地下洞穴 1～5 層大型裝飾物（1:1 尺度，左側女巫高約 1.7m 為比例尺）</strong><br>` +
          `依洞裡 5 層岩色與規則塑形；可按「洞穴火把掃光」測試黑洞裡只有動態火把與法師光球掃過時，四層濕岩與五層皺金箔的反光效果。` +
          `<div class="meta">6 座合計 <strong>${totalTris}</strong> 個三角形（平均每座 ${Math.round(totalTris / ITEMS.length)} tris）。</div>`;
      } else {
        const idx = +state.item;
        const m = propGroups[idx];
        if (m) {
          goalTarget.set(m.x, m.y, m.z);
          goalDist = m.dist;
          const it = m.item;
          infoEl.innerHTML = `<strong>${it.name}</strong>（${it.zone}，高約 ${it.height.toFixed(2)}m）<br>${it.desc}` +
            `<div class="meta">面數：<strong>${it.tris}</strong> 個三角形　｜　組件：${it.parts} 個基本圖元　｜　可切換「洞穴火把掃光」檢視切面光影</div>`;
        }
      }
    }

    scene.traverse((o) => {
      if (o.isMesh && (o.userData.role === 'lit' || o.userData.role === 'wet' || o.userData.role === 'foil')) {
        const w = new THREE.Mesh(o.geometry, matWire);
        w.userData.isWire = true;
        w.visible = false;
        o.add(w);
      }
    });

    ITEMS.forEach((it, i) => {
      it.tris = propGroups[i].g.userData.tris;
      it.parts = propGroups[i].g.userData.parts;
    });

    for (const b of document.querySelectorAll('[data-item]')) {
      b.onclick = () => {
        state.compare = false;
        state.item = b.dataset.item;
        updateUI();
      };
    }
    document.getElementById('btnTorch').onclick = () => { state.torch = !state.torch; state.form = false; updateUI(); };
    document.getElementById('btnCompare').onclick = () => { state.compare = !state.compare; updateUI(); };
    document.getElementById('btnForm').onclick = () => { state.form = !state.form; updateUI(); };
    document.getElementById('btnWire').onclick = () => { state.wire = !state.wire; updateUI(); };

    let drag = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      yaw -= (e.clientX - drag[0]) * 0.007;
      pitch = Math.max(-0.18, Math.min(1.32, pitch + (e.clientY - drag[1]) * 0.007));
      drag = [e.clientX, e.clientY];
    });
    addEventListener('pointerup', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => {
      goalDist = Math.max(1.8, Math.min(26, goalDist * (1 + e.deltaY * 0.001)));
    }, { passive: true });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    updateUI();
    if (params.has('dist')) { dist = goalDist = +params.get('dist'); }
    target.copy(goalTarget);

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.getElapsedTime();
      uTime.value = t;

      // 洞穴模式：暖火把在主目標周圍掃光、冷法師光球在對側微弱補反光
      if (state.torch && !state.form) {
        if (state.item !== 'all' && !state.compare && propGroups[+state.item]) {
          const m = propGroups[+state.item];
          torchLight.position.set(m.x + Math.sin(t * 0.9) * 1.45, 1.45 + Math.sin(t * 2.3) * 0.14, m.z + 1.35 + Math.cos(t * 0.9) * 0.65);
          mageLight.position.set(m.x - Math.sin(t * 0.7) * 1.6, 1.75, m.z - 0.85);
        } else {
          torchLight.position.set(Math.sin(t * 0.55) * 4.4, 1.65 + Math.sin(t * 2.1) * 0.15, 1.45 + Math.cos(t * 0.55) * 0.9);
          mageLight.position.set(-Math.sin(t * 0.55) * 3.8, 2.0, -0.6);
        }
        torchLight.intensity = 4.2 + Math.sin(t * 9.0) * 0.32;
        torchOrb.position.copy(torchLight.position);
      }

      character.update(dt, 0);
      target.lerp(goalTarget, Math.min(1, dt * 8));
      dist += (goalDist - dist) * Math.min(1, dt * 8);
      const c = Math.cos(pitch);
      camera.position.set(target.x + Math.sin(yaw) * c * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * c * dist);
      camera.lookAt(target);
      renderer.render(scene, camera);
    });

    window.__dongProps = { state, updateUI, ITEMS };
    window.__ready = true;
  </script>
</body>

</html>
