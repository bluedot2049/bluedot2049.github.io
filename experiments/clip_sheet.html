<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>穿模總表</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>body { margin: 0; background: #2a1d15; color: #e8dcc8; font: 13px sans-serif; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
  // 穿模總表：兩樣東西排成格子，每格從斜前方和側面（或背面）各拍一張，一眼看出哪些組合會穿。
  // ?set=hathair 人的髮型 × 帽子｜face 五官 × 眼鏡｜beard 鬍子 × 脖子｜racehat 種族 × 帽子｜hood 連身頭套 × 髮型和種族｜outerback 外套 × 背上｜outerneck 外套 × 脖子｜cam 相機 × 下身和外套｜handhat 右手的東西 × 帽子
  //   kaohand 右手的東西 × 顏文字的手（?body= 身體第幾個，撐著）｜kaobody 顏文字的身體 × 手（?look={"hand":…} 換手上的東西）｜kaoface 顏文字的臉 × 嘴巴
  //   數字的檢查先跑 node tools/check-poses.mjs，列出來的最糟組合再來這裡看
  // ?rows= &cols= 只拍其中幾列、幾欄（逗號隔開）｜?views= ?look= 見下
  // ?pose=stand 站（預設）｜walk 走到手擺最前｜clap 拍手｜sit 坐地上｜bench 坐椅子｜lie 躺下｜selfie 自拍
  // 拍完把整張圖放在 window.sheet（dataURL），#out 出現
  import * as THREE from 'three';
  import { Character } from '../js/avatar/character.js';
  import { presetLook, OPTIONS, RACES } from '../js/avatar/looks.js';
  import { FACES, HANDS, BODIES, kaoCode } from '../js/avatar/kaomoji-parts.js';

  const q = new URLSearchParams(location.search), set = q.get('set') || 'hathair';
  const ids = (k) => OPTIONS[k].map(([id]) => id);
  const base = () => ({ ...presetLook(2), neck: 'none', back: 'none', hand: 'none' });
  const SETS = {
    hathair: { rows: ids('hair'), cols: ids('hat'), look: (r, c) => ({ ...base(), hair: r, hat: c }), frame: 'head', views: ['front', 'side'] },
    racehat: { rows: RACES.map((r) => r.id), cols: ids('hat'), look: (r, c) => ({ ...base(), race: r, skin: RACES.find((x) => x.id === r).skin ?? 0, hat: c }), frame: 'head', views: ['front', 'side'] },
    hood: { rows: [...ids('hair').map((h) => 'hair:' + h), ...RACES.filter((r) => r.id !== 'human').map((r) => 'race:' + r.id)], cols: ['dino', 'panda', 'banana', 'astronaut'],
      look: (r, c) => { const [k, v] = r.split(':'), L = { ...base(), one: c }; if (k === 'hair') L.hair = v; else { L.race = v; L.skin = RACES.find((x) => x.id === v).skin ?? 0; } return L; }, frame: 'head', views: ['front', 'side'] },
    outerback: { rows: ids('outer'), cols: ids('back'), look: (r, c) => ({ ...base(), outer: r, back: c }), frame: 'body', views: ['front', 'back'] },
    outerneck: { rows: ids('outer'), cols: ids('neck'), look: (r, c) => ({ ...base(), outer: r, neck: c }), frame: 'body', views: ['front', 'side'] },
    face: { rows: [...ids('nose').map((v) => 'nose:' + v), ...ids('mark').map((v) => 'mark:' + v), ...ids('mouth').map((v) => 'mouth:' + v)], cols: ids('glasses'),
      look: (r, c) => { const [k, v] = r.split(':'); return { ...base(), hat: 'none', [k]: v, glasses: c }; }, frame: 'head', views: ['front', 'side'] },
    beard: { rows: ['none', 'stache', 'beard'], cols: ids('neck'), look: (r, c) => ({ ...base(), hat: 'none', mark: r, neck: c }), frame: 'head', views: ['front', 'side'] },
    cam: { rows: [...ids('bottom').map((b) => 'bottom:' + b), ...ids('outer').map((o) => 'outer:' + o), ...ids('one').map((o) => 'one:' + o)], cols: ['cam'],
      look: (r) => { const [k, v] = r.split(':'); return { ...base(), [k]: v }; }, frame: 'body', views: ['front', 'side'], camera: true },
    handhat: { rows: ids('hand').filter((h) => h !== 'none'), cols: ids('hat'), look: (r, c) => ({ ...base(), hand: r, hat: c }), frame: 'full', views: ['front', 'side'] },
    // 顏文字：欄、列的名字是零件的寫法，kao 給每格擺哪一組（臉固定笑）
    kaohand: { rows: ids('hand'), cols: HANDS.map((h) => h.w), look: (r) => ({ ...base(), hand: r }), kao: (r, c) => kaoCode(1, HANDS.findIndex((h) => h.w === c), +(q.get('body') || 0)), frame: 'full', views: ['front', 'side'] },
    kaoface: { rows: FACES.map((f) => f.t), cols: ids('mouth'), look: (r, c) => ({ ...base(), mouth: c }), kao: (r) => kaoCode(FACES.findIndex((f) => f.t === r), 0, 0), frame: 'head', views: ['front'] },
    kaobody: { rows: BODIES.map((b) => b.w), cols: HANDS.map((h) => h.w), look: () => base(), kao: (r, c) => kaoCode(1, HANDS.findIndex((h) => h.w === c), BODIES.findIndex((b) => b.w === r)), frame: 'full', views: ['front', 'side'] },
  };
  // 姿勢：每格換好外觀後從站著開始，一次走到定格
  // 最後一秒用小步走完（手上的東西會盪，一大步跳過去會甩飛）：[開始做什麼, 速度]
  const POSES = {
    stand: [() => {}, 0],
    walk: [(m) => { m.phase = Math.PI / 2 - 11; }, 2],
    clap: [(m) => m.emote('👏'), 0],
    sit: [(m) => { m.sitting = true; }, 0],
    bench: [(m) => { m.sitting = true; m.lift = 0.45; }, 0],
    lie: [(m) => { m.sitting = m.lying = true; m.update(1, 0); }, 0],
    selfie: [(m) => m.setAim({ grip: 3, pitch: 0 }), 0],
  };
  const pose = POSES[q.get('pose') || 'stand'];
  const S = SETS[set];
  // ?rows=a,b&cols=c,d 只拍其中幾列、幾欄
  for (const k of ['rows', 'cols']) if (q.get(k)) S[k] = S[k].filter((v) => q.get(k).split(',').includes(v));
  // ?views=front,back 換拍的角度；?look={"race":…} 每格再疊上的外觀（JSON）
  if (q.get('views')) S.views = q.get('views').split(',');
  if (q.get('look')) { const f = S.look, add = JSON.parse(q.get('look')); S.look = (r, c) => ({ ...f(r, c), ...add }); }
  const CELL = +q.get('cell') || 150, LAB = 90, HEAD = 22, FOV = 26;
  const vw = S.views.length;
  const W = LAB + S.cols.length * CELL * vw, H = HEAD + S.rows.length * CELL;

  const gl = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
  gl.setSize(CELL, CELL, false);
  gl.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xfff0dc, 0x6a4a34, 1.9));
  const sun = new THREE.DirectionalLight(0xffcf98, 1.3);
  sun.position.set(2, 4, 5);
  scene.add(sun);
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.05, 20);
  const model = new Character(null, {});
  model.shadow.visible = false;
  scene.add(model.group);

  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  document.body.appendChild(out);
  const g = out.getContext('2d');
  g.fillStyle = '#2a1d15'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#e8dcc8'; g.font = '12px sans-serif'; g.textBaseline = 'middle';
  S.cols.forEach((c, i) => g.fillText(c, LAB + i * CELL * vw + 6, HEAD / 2));

  const sleep = () => new Promise((r) => requestAnimationFrame(r));
  for (let ri = 0; ri < S.rows.length; ri++) {
    g.fillStyle = '#e8dcc8';
    g.fillText(S.rows[ri], 6, HEAD + ri * CELL + CELL / 2);
    for (let ci = 0; ci < S.cols.length; ci++) {
      model.setLook(S.look(S.rows[ri], S.cols[ci]));
      if (S.camera) model.setCamera('bulb');
      model.group.position.set(0, 0, 0);
      model.sitting = model.lying = false;
      model.lift = 0;
      model.act = null;
      model.setAim(null);
      model.setKao(0);
      model.swX = model.swZ = model.swVX = model.swVZ = 0;
      model.hpOk = model.hvOk = false;
      for (let i = 0; i < 3; i++) model.update(1, 0);
      model.group.position.set(0, 0, 0);
      pose[0](model);
      if (S.kao) { model.setKao(S.kao(S.rows[ri], S.cols[ci])); model.brace(true); }
      for (let i = 0; i < 60; i++) {
        model.group.position.set(0, 0, 0);
        model.update(1 / 60, pose[1]);
      }
      model.group.updateMatrixWorld(true);
      const h = model.S.H;
      const f = S.frame === 'head'
        ? { y: (h * 0.8 + model.dims.topY) / 2, s: Math.max(0.5, (model.dims.topY - h * 0.8) * 1.3 + 0.15) }
        : S.frame === 'full' ? { y: h * 0.85, s: 2.1 * h }
        : { y: h * 0.52, s: 0.95 * h };
      const d = f.s / 2 / Math.tan(THREE.MathUtils.degToRad(FOV / 2));
      S.views.forEach((v, vi) => {
        const a = v === 'front' ? 0.35 : v === 'side' ? Math.PI / 2 : Math.PI - 0.35;
        camera.position.set(Math.sin(a) * d, f.y + f.s * 0.1, Math.cos(a) * d);
        camera.lookAt(0, f.y, 0);
        gl.render(scene, camera);
        g.drawImage(gl.domElement, LAB + (ci * vw + vi) * CELL, HEAD + ri * CELL);
      });
      g.strokeStyle = 'rgba(232,184,106,.25)';
      g.strokeRect(LAB + ci * vw * CELL + 0.5, HEAD + ri * CELL + 0.5, CELL * vw - 1, CELL - 1);
    }
    await sleep();
  }
  window.sheet = out.toDataURL('image/png');
  const o = document.createElement('pre'); o.id = 'out'; o.textContent = 'done'; o.hidden = true; document.body.appendChild(o);
</script>
</body>
</html>
