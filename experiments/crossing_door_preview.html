<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渡海預覽・門的邏輯</title>
<style>
  /* 渡海改版預覽（有色插畫）：跟開場的門口同一套邏輯。
     海平線是門縫，透出目的地的光；載入時縫慢慢寬一點（門板的 ajar），不會開大。
     到了：船靠岸一頓（聲音），縫先撐開一點、停半拍，再整個打開，畫面往前推近，目的地的顏色鋪滿。
     效能：每個會動的東西是自己一層 div，只動 transform 和 opacity，主執行緒在編著色器時也照跑；不用 filter、不動 SVG 裡面 */
  :root { --gold: #e8b86a; --gold-hi: #f6dba6; --gold-lo: #a9763a; --muted: #b5a084; }
  body { margin: 0; background: #241a13; color: #e8dcc8; font: 13px "Noto Serif TC", serif; }
  .bar { position: sticky; top: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: #1c130d; border-bottom: 1px solid rgba(232,184,106,.2); }
  .bar button { font: inherit; color: var(--gold-hi); background: none; border: 1px solid var(--gold-lo); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .bar button.on { border-color: var(--gold); background: rgba(232,184,106,.14); }
  .bar .note { color: var(--muted); }
  .frames { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px 16px; align-items: flex-start; }
  .frame { position: relative; container-type: size; overflow: hidden; outline: 1px solid rgba(232,184,106,.15); }
  .frame.portrait { width: 390px; height: 760px; }
  .frame.landscape { width: 760px; height: 390px; }
  .frame.wide { width: 1200px; height: 680px; }
  .tag { position: absolute; left: 8px; top: 6px; color: rgba(255,255,255,.3); font-size: 11px; z-index: 5; }

  /* ───── 下面這段是要搬進 style.css 的（正式版 #loading 加 container-type: size，cq 單位就照整個畫面算） ───── */
  .cross {
    position: absolute; inset: 0; overflow: hidden; --t: 0ms;
    --hz: 47cqh;                       /* 海平線離上緣多遠 */
    --b: calc(100cqh - var(--hz));     /* 海平線以下有多高，船照這個縮放 */
    background: #171a28;
  }
  /* 目的地的光：門縫、光暈、水上的光路、船舷的反光、最後鋪滿的顏色 */
  .cross.to-gallery { --door: #ffe8c8; --door2: #f2a682; --halo: rgba(242, 160, 120, .38); --rim: #c98a6c; --flood: radial-gradient(circle at 50% 47%, #fff3dc, #ffd9a8 45%, #f4b984); }
  .cross.to-haishi { --door: #e2edf8; --door2: #86a4d4; --halo: rgba(120, 150, 210, .36); --rim: #8ea4cc; --flood: radial-gradient(circle at 50% 47%, #eef4fa, #b4c8e6 45%, #7088b4); }
  .cross .view { position: absolute; inset: 0; transform-origin: 50% var(--hz); }
  .cross .view > * { position: absolute; }
  /* 天和海：兩地之間的暮藍，不用純黑。這層不動 */
  .cross .sky { inset: 0; background: linear-gradient(#1d2135, #2e2e48 calc(var(--hz) * .55), #4c4462 calc(var(--hz) - 1px), #2a2c44 calc(var(--hz) + 1px), #1f2234 calc(var(--hz) + var(--b) * .35), #161926); }
  /* 光暈：縫上下一片淡淡的目的地色，慢慢呼吸 */
  .cross .halo { left: -20%; right: -20%; top: calc(var(--hz) - 16cqh); height: 32cqh; background: radial-gradient(closest-side, var(--halo), transparent); animation: breathe 7.3s ease-in-out calc(var(--t) - 2.4s) infinite; }
  /* 門縫：海平線上一條光，中間最亮往兩邊淡掉。載入時 16 秒慢慢寬一點，跟門板的 ajar 一樣不會開大 */
  .cross .slit { left: 0; right: 0; top: calc(var(--hz) - 1px); height: 2px; background: linear-gradient(90deg, transparent 4%, var(--door2) 24%, var(--door) 50%, var(--door2) 76%, transparent 96%); animation: crack 16s cubic-bezier(.15, .55, .3, 1) var(--t) forwards; }
  /* 水上的光路：縫的光往船這邊鋪過來，越近越寬越淡 */
  .cross .road { left: 0; right: 0; top: var(--hz); bottom: 0; clip-path: polygon(47% 0, 53% 0, 74% 100%, 26% 100%); background: linear-gradient(var(--door2), transparent 70%); opacity: .22; animation: road 4.1s ease-in-out calc(var(--t) - 1.7s) infinite alternate; }
  /* 水面的碎光：從縫底下冒出來往兩旁、往船這邊流，拉長，流出畫面。每條相位都不一樣 */
  .cross .rip { left: 50%; top: var(--hz); width: 1.2cqh; height: 2px; margin-left: -.6cqh; border-radius: 1px; background: var(--door); opacity: 0;
    animation: rip var(--d, 5s) cubic-bezier(.55, 0, .9, .6) calc(var(--t) + var(--p)) infinite; }
  /* 燈塔：海市外海那座，全世界都看得到。剪影不動，燈每六秒閃兩下 */
  .cross .tower { left: calc(50% + min(var(--b) * .5, 30cqw)); top: calc(var(--hz) - var(--b) * .085); height: calc(var(--b) * .09); aspect-ratio: 10 / 18; translate: -50% 0; }
  .cross .tower svg { display: block; width: 100%; height: 100%; }
  .cross .beacon { left: calc(50% + min(var(--b) * .5, 30cqw)); top: calc(var(--hz) - var(--b) * .07); width: calc(var(--b) * .12); aspect-ratio: 1; translate: -50% -50%;
    background: radial-gradient(closest-side, #f4f7fa, rgba(220, 232, 244, .5) 18%, transparent); animation: beacon 6s linear calc(var(--t) - 4.2s) infinite; }
  /* 船：海平線以下照高度縮放，海平線剛好在 viewBox 的 y=0。外面一層給靠岸那一頓，裡面一層一直晃 */
  .cross .boat { left: 50%; top: calc(var(--hz) - var(--b) * 50 / 190); width: calc(var(--b) * 400 / 190); height: calc(var(--b) * 240 / 190); translate: -50% 0; transform-origin: 50% 100%; }
  .cross .bob { position: absolute; inset: 0; transform-origin: 50% 100%; animation: bob 5.3s ease-in-out calc(var(--t) - 2.6s) infinite; }
  .cross .bob svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  /* 船頭燈的光：燈芯冷白，光暈染目的地的顏色 */
  .cross .glow { position: absolute; left: 43.8%; top: 5.4%; width: 26%; aspect-ratio: 1; translate: -50% -50%; background: radial-gradient(closest-side, rgba(240, 246, 250, .55), var(--halo) 30%, transparent); animation: flicker 3.7s linear calc(var(--t) - 1.3s) infinite; }
  .cross .wick { position: absolute; left: 43.8%; top: 5.4%; width: 1.2%; aspect-ratio: 2 / 3.4; translate: -50% -50%; border-radius: 1px; background: #eef3f6; animation: flicker 2.9s linear calc(var(--t) - .7s) infinite; }
  .cross .msg { position: absolute; left: 0; right: 0; bottom: max(4cqh, 18px); text-align: center; padding-left: .4em; letter-spacing: .4em; color: rgba(232, 220, 200, .6); font-size: 14px; }
  .cross .flood { inset: 0; position: absolute; background: var(--flood); opacity: 0; transition: opacity .7s 1.2s; pointer-events: none; }
  .cross.opening .flood { opacity: 1; }
  .cross.opening .msg { opacity: 0; transition: opacity .35s; }

  @keyframes crack { from { transform: scaleY(1); } to { transform: scaleY(3); } }
  @keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes road { from { opacity: .16; } to { opacity: .28; } }
  @keyframes rip {
    0% { transform: translate(calc(var(--x) * 1cqw), 0) scaleX(.3); opacity: 0; }
    20% { opacity: .55; }
    100% { transform: translate(calc((var(--x) + var(--dx)) * 1cqw), var(--b)) scaleX(5); opacity: 0; }
  }
  @keyframes bob { 0%, 100% { transform: none; } 33% { transform: translateY(.2%) rotate(.35deg); } 70% { transform: translateY(-.15%) rotate(-.45deg); } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 18% { opacity: .8; } 22% { opacity: .95; } 61% { opacity: .85; } 70% { opacity: 1; } }
  @keyframes beacon { 0%, 3% { opacity: .15; } 5% { opacity: 1; } 7%, 13% { opacity: .15; } 15% { opacity: 1; } 17%, 100% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { .cross * { animation: none !important; } .cross .rip { opacity: .3; } }
</style>
</head>
<body>
<div class="bar">
  <button data-to="haishi" class="on">往海市</button>
  <button data-to="gallery">回畫廊</button>
  <button id="restart">重新開頁（--t = 0）</button>
  <button id="resume">換頁接續（--t = −7.3s）</button>
  <button id="push">搭船（出發的聲音）</button>
  <button id="arrive">到了（靠岸、開縫）</button>
  <button id="jank">主執行緒卡 3 秒</button>
  <span class="note">卡住時動畫要照跑才算合格；遊戲裡靜音的話這裡也沒聲音</span>
</div>
<div class="frames">
  <div class="frame portrait"><span class="tag">手機直式 390×760</span></div>
  <div class="frame landscape"><span class="tag">手機橫式 760×390</span></div>
  <div class="frame wide"><span class="tag">桌機 1200×680</span></div>
</div>

<template id="scene">
  <div class="cross to-haishi" aria-hidden="true">
    <div class="view">
      <div class="sky"></div>
      <div class="halo"></div>
      <div class="road"></div>
      <div class="slit"></div>
      <div class="tower"><svg viewBox="0 0 10 18"><path fill="#262638" d="M0 18Q2 16.6 5 16.7Q8 16.6 10 18ZM3.2 17L3.9 6.4H6.1L6.8 17ZM3 6.4H7V5.6H3ZM3.9 5.6V3.9H6.1V5.6ZM3.4 3.9L5 1.6L6.6 3.9Z"/></svg></div>
      <div class="beacon"></div>
      <i class="rip" style="--x:-2;--dx:-34;--p:-.4s"></i>
      <i class="rip" style="--x:-4;--dx:-46;--p:-2.9s;--d:5.6s"></i>
      <i class="rip" style="--x:-1;--dx:-20;--p:-4.1s;--d:6.1s"></i>
      <i class="rip" style="--x:-6;--dx:-52;--p:-1.6s;--d:5.3s"></i>
      <i class="rip" style="--x:2;--dx:30;--p:-1.1s;--d:5.4s"></i>
      <i class="rip" style="--x:4;--dx:44;--p:-3.8s"></i>
      <i class="rip" style="--x:1;--dx:18;--p:-2.2s;--d:6.3s"></i>
      <i class="rip" style="--x:5;--dx:50;--p:-4.6s;--d:5.8s"></i>
      <!-- 坐在船上往前看：跟金線版同一艘船、同一個船夫，座標沿用，放大兩倍讓海平線落在 y=0 -->
      <div class="boat"><div class="bob">
        <svg viewBox="-200 -50 400 240">
          <defs>
            <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a2a"/><stop offset=".45" stop-color="#2a1f22"/><stop offset="1" stop-color="#1c1519"/></linearGradient>
          </defs>
          <g transform="scale(2) translate(-100 -104)" stroke-linecap="round" stroke-linejoin="round">
            <!-- 船艙：裡面的木頭，底板幾道縫 -->
            <path fill="url(#hull)" d="M-200 283.8L-44 183.8Q16 145.4 98.2 127.4L101.8 127.4Q184 145.4 244 183.8L400 283.8V300H-200Z"/>
            <path fill="none" stroke="#3d2d2c" stroke-width=".5" d="M38 200L98.8 129.8M100 200V129.8M162 200L101.2 129.8"/>
            <!-- 橫在前面的坐板 -->
            <path fill="#3c2a25" d="M32.8 147.8H167.2L170.8 153.2H29.2Z"/>
            <path fill="none" stroke="#5a4034" stroke-width=".6" d="M32.8 147.8H167.2"/>
            <!-- 船舷：內緣一道暗線，上緣照到前面的光 -->
            <path fill="none" stroke="#1a1418" stroke-width="1.6" d="M-194 280L-40 181.4Q16 146.6 88 129.8M394 280L240 181.4Q184 146.6 112 129.8"/>
            <path fill="none" stroke="var(--rim)" stroke-width=".9" d="M-200 283.8L-44 183.8Q16 145.4 98.2 127.4M400 283.8L244 183.8Q184 145.4 101.8 127.4"/>
            <!-- 船頭天鵝頸 -->
            <path fill="none" stroke="#221a1e" stroke-width="2.2" d="M100 128.3C102.1 122.9 101.5 116.9 99.4 113.9C97.9 111.5 98.5 109.1 100.3 108.2"/>
            <path fill="none" stroke="var(--rim)" stroke-width=".5" d="M101.2 125.6C102.2 121.6 101.6 117.4 100.2 114.6"/>
            <circle fill="#221a1e" cx="100.45" cy="107.75" r="1.5"/>
            <path fill="none" stroke="#221a1e" stroke-width=".9" d="M101.4 107L102.6 105.7"/>
            <!-- 船夫：黑袍背對著站在船頭，燈那一側的袍邊亮一道 -->
            <path fill="#17161f" d="M66 139.9C67.3 130 68.3 118.2 69.6 110.2C69.9 106.9 70.6 104.3 71.9 102.3C72.6 99.7 73.5 97.4 74.9 95.1C75.9 98 76.8 100.7 77.5 103C78.5 105 79.2 107.6 79.2 110.9C80.1 118.8 81.1 130 82.5 139.9Z"/>
            <path fill="none" stroke="var(--rim)" stroke-width=".55" d="M74.9 95.1C75.9 98 76.8 100.7 77.5 103C78.5 105 79.2 107.6 79.2 110.9C80.1 118.8 81.1 130 82.5 139.9"/>
            <path fill="none" stroke="#17161f" stroke-width="1.1" d="M78.2 112.2Q82.1 114.9 86.4 113.5"/>
            <path fill="none" stroke="#2a2430" stroke-width=".7" d="M86.4 141.3L87.4 87.4M86.1 82.6H89.1"/>
            <path fill="#2a2430" d="M86.2 82.9H89L88.6 87.1H86.6Z"/>
          </g>
        </svg>
        <div class="glow"></div>
        <div class="wick"></div>
      </div></div>
    </div>
    <div class="flood"></div>
    <div class="msg">渡海　往海市</div>
  </div>
</template>

<script type="module">
  import { Ambience } from '../js/ambience.js';
  const amb = new Ambience();

  let to = 'haishi', t = 0;
  function build() {
    for (const fr of document.querySelectorAll('.frame')) {
      fr.querySelector('.cross')?.remove();
      const s = document.getElementById('scene').content.firstElementChild.cloneNode(true);
      // 每個框的漸層要有自己的 id，不然三個框會互相參照
      const k = [...fr.parentNode.children].indexOf(fr);
      s.innerHTML = s.innerHTML.replaceAll('"hull"', `"hull${k}"`).replaceAll('#hull)', `#hull${k})`);
      s.className = 'cross to-' + to;
      s.style.setProperty('--t', t + 'ms');
      s.querySelector('.msg').textContent = to === 'haishi' ? '渡海　往海市' : '渡海　回畫廊';
      fr.appendChild(s);
    }
  }

  // 到了：跟 ui.js 的 enterDoor 同一個節奏。船靠岸一頓（門閂），縫撐開一點、停半拍（門先推一點），再整個打開、往前推近、光鋪滿
  function arrive(sc) {
    const boat = sc.querySelector('.boat'), slit = sc.querySelector('.slit'), view = sc.querySelector('.view'), halo = sc.querySelector('.halo');
    boat.animate([
      { transform: 'none', easing: 'ease-out' },
      { transform: 'translateY(-.8%) rotate(-.6deg)', offset: 0.16 },
      { transform: 'translateY(.4%) rotate(.2deg)', offset: 0.45 },
      { transform: 'none' },
    ], { duration: 900 });
    const from = getComputedStyle(slit).transform;
    for (const a of slit.getAnimations()) a.cancel();
    slit.animate([
      { transform: from, easing: 'ease-out' },
      { transform: 'scaleY(9)', offset: 0.2 },
      { transform: 'scaleY(9)', offset: 0.32, easing: 'cubic-bezier(.5, 0, .3, 1)' },
      { transform: 'scaleY(420)' },
    ], { duration: 1600, delay: 250, fill: 'forwards' });
    halo.animate([{ transform: 'none' }, { transform: 'scaleY(3)' }], { duration: 1500, delay: 600, easing: 'ease-in', fill: 'forwards' });
    view.animate([{ transform: 'none' }, { transform: 'scale(1.35)' }], { duration: 1700, delay: 400, easing: 'cubic-bezier(.5, 0, .2, 1)', fill: 'forwards' });
    sc.classList.add('opening');
  }

  for (const b of document.querySelectorAll('[data-to]')) b.onclick = () => {
    to = b.dataset.to; for (const o of document.querySelectorAll('[data-to]')) o.classList.toggle('on', o === b); build();
  };
  document.getElementById('restart').onclick = () => { t = 0; build(); };
  document.getElementById('resume').onclick = () => { t = -7300; build(); };
  document.getElementById('push').onclick = () => amb.voice('push', 0.6);
  document.getElementById('arrive').onclick = () => {
    amb.voice('moor', 0.6);
    for (const s of document.querySelectorAll('.cross')) arrive(s);
    setTimeout(build, 3200);
  };
  // 假裝在編著色器：主執行緒整整卡三秒。合成執行緒上的動畫要照跑
  document.getElementById('jank').onclick = () => { const end = performance.now() + 3000; while (performance.now() < end); };
  build();
</script>
</body>
</html>
