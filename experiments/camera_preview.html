<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>相機模型預覽</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1c1814; color: #e9e0cc; font-family: "Noto Serif TC", serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,0.5)); }
    .bar button { padding: 8px 12px; border: 1px solid #5a4e3e; border-radius: 6px; background: #2a241e; color: inherit; font: inherit; cursor: pointer; }
    .note { position: fixed; top: 12px; left: 16px; font-size: 13px; opacity: 0.6; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div class="note">拖曳轉、滾輪縮放。上排放大看，下排是掛在角色身上的實際大小。網址 ids=bulb,gui,wang 選要看哪幾台；gui@0.5 是日晷III 伸出五成；aim=1 下排舉起來</div>
  <div class="bar">
    <label id="ext" hidden>伸縮 <input type="range" min="0" max="1" step="0.01" value="0"></label>
    <button data-v="0">正面</button>
    <button data-v="0.7">斜前</button>
    <button data-v="1.57">側面</button>
    <button data-v="3.14">背面</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { Kit, newBucket } from '../js/core/props.js';
    import { bucketObjects } from '../js/core/scenery.js';
    import { cameraModel, isChrome, chromeMat } from '../js/camera/cameras.js';
    import { Character } from '../js/avatar/character.js';
    import { sanitizeLook } from '../js/avatar/looks.js';
    import { shadowTexture } from '../js/core/textures.js';

    const params = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1c1814);
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a3026, 1.6));
    const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
    sun.position.set(2, 4, 3);
    scene.add(sun);

    // 上排：每台放大 S 倍
    const S = 5;
    const ids = (params.get('ids') || 'bulb,gui,wang').split(',');
    const GAP = +(params.get('gap') || 1.3);
    const model = (id) => {
      const k = new Kit(null);
      cameraModel(k, id);
      const b = newBucket();
      k.emit(b, 0, 0, 0);
      const g = new THREE.Group();
      for (const o of bucketObjects(b)) g.add(o);
      if (isChrome(id)) g.traverse((o) => { if (o.isMesh) o.material = chrome; });
      return g;
    };
    // 亮面相機：反光貼圖的天和地，網址 sky=、ground= 換（色碼不加 #）
    const chrome = chromeMat(params.has('sky') ? '#' + params.get('sky') : undefined, params.has('ground') ? '#' + params.get('ground') : undefined);
    const tops = ids.map((id, i) => {
      const g = model(id);
      g.scale.setScalar(S);
      g.position.set((i - (ids.length - 1) / 2) * GAP, 0.9, 0);
      scene.add(g);
      return g;
    });
    // 會伸縮的（日晷III）多一條滑桿：拉的時候每台都照「自己寫的 @ 值＋滑桿」重建
    if (ids.some((id) => id.startsWith('gui'))) {
      const box = document.getElementById('ext'), input = box.querySelector('input');
      box.hidden = false;
      box.style.cssText = 'display:flex;gap:6px;align-items:center';
      input.oninput = () => ids.forEach((id, i) => {
        if (!id.startsWith('gui')) return;
        const own = +(id.split('@')[1] || 0), g = tops[i];
        for (const o of [...g.children]) { g.remove(o); o.geometry?.dispose(); }
        for (const o of model('gui@' + Math.min(1, own + +input.value)).children) g.add(o.clone());
      });
    }

    // 下排：角色帶著第一台，比大小
    const shadowTex = shadowTexture();
    const chars = ids.map((id, i) => {
      const c = new Character(shadowTex, sanitizeLook({}));
      c.group.position.set((i - (ids.length - 1) / 2) * GAP, -0.9, 0);
      const [base, ext] = id.split('@');
      c.setCamera(base);
      c.setZoom?.(+ext || 0);
      if (params.has('aim')) c.setAim({ grip: 1, pitch: 0 });
      scene.add(c.group);
      return c;
    });

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
    let yaw = +(params.get('yaw') ?? 0.7), pitch = +(params.get('pitch') ?? 0.25), dist = +(params.get('dist') ?? 5);
    const TY = +(params.get('ty') ?? 0.3);
    function place() {
      const c = Math.cos(pitch);
      camera.position.set(Math.sin(yaw) * c * dist, TY + Math.sin(pitch) * dist, Math.cos(yaw) * c * dist);
      camera.lookAt(0, TY, 0);
    }
    let drag = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      yaw -= (e.clientX - drag[0]) * 0.008;
      pitch = Math.max(-0.5, Math.min(1.4, pitch + (e.clientY - drag[1]) * 0.008));
      drag = [e.clientX, e.clientY];
    });
    addEventListener('pointerup', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => { dist = Math.max(1, Math.min(12, dist * (1 + e.deltaY * 0.001))); }, { passive: true });
    for (const b of document.querySelectorAll('[data-v]')) b.onclick = () => { yaw = +b.dataset.v; };
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      for (const c of chars) c.update(dt, 0);
      place();
      renderer.render(scene, camera);
    });
    window.__ready = true;
  </script>
</body>
</html>
