<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收音機造型</title>
  <!-- 前廳的落地收音機（js/zones/gallery/radio.js），旁邊站一個角色比大小。只看模型，沒有聲音；擺在前廳相機桌和出口之間的牆角 -->
  <style>
    html, body { margin: 0; height: 100%; background: #1c1814; color: #e9e0cc; font-family: "Noto Serif TC", serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,0.5)); }
    .bar button { padding: 8px 12px; border: 1px solid #5a4e3e; border-radius: 6px; background: #2a241e; color: inherit; font: inherit; cursor: pointer; }
    .note { position: fixed; top: 12px; left: 16px; font-size: 13px; opacity: 0.6; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div class="note">拖曳轉、滾輪縮放。網址 dark=1 用前廳那種暗的光</div>
  <div class="bar">
    <button id="power">開機</button>
    <button id="next">轉下一台</button>
    <button id="mid">停在兩台中間</button>
    <button data-v="0">正面</button>
    <button data-v="0.6">斜前</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { buildRadio, DIAL_AT } from '../js/zones/gallery/radio.js';
    import { Character } from '../js/avatar/character.js';
    import { sanitizeLook } from '../js/avatar/looks.js';
    import { shadowTexture } from '../js/core/textures.js';

    const params = new URLSearchParams(location.search);
    const dark = params.get('dark') === '1';
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1c1814);
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a3026, dark ? 0.45 : 1.6));
    const sun = new THREE.DirectionalLight(0xffeedd, dark ? 0.3 : 1.2);
    sun.position.set(2, 4, 3);
    scene.add(sun);
    // 牆和地板
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshLambertMaterial({ color: '#5a4636' }));
    wall.position.set(0, 1.5, -0.21);
    scene.add(wall);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 4), new THREE.MeshLambertMaterial({ color: '#3a2a20' }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.z = 1.8;
    scene.add(floor);

    const radios = [buildRadio()];
    radios[0].group.position.set(-0.35, 0, 0);
    scene.add(radios[0].group);
    const c = new Character(shadowTexture(), sanitizeLook({}));
    c.group.position.set(0.55, 0, 0.35);
    scene.add(c.group);

    // 轉台：指針滑過去，中間那段魔眼暗著
    let on = false, at = 0, dialF = DIAL_AT[0];
    const tunedAt = (f) => Math.max(0, 1 - Math.min(...DIAL_AT.map((s) => Math.abs(s - f))) / 0.03);
    const apply = () => radios.forEach((r) => { r.setPower(on); r.setDial(dialF); });
    document.getElementById('power').onclick = (e) => { on = !on; e.target.textContent = on ? '關機' : '開機'; apply(); };
    document.getElementById('next').onclick = () => { at = (at + 1) % DIAL_AT.length; dialF = DIAL_AT[at]; apply(); };
    document.getElementById('mid').onclick = () => { dialF = (DIAL_AT[at] + DIAL_AT[(at + 1) % DIAL_AT.length]) / 2; apply(); };

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
    let yaw = +(params.get('yaw') ?? 0.25), pitch = +(params.get('pitch') ?? 0.18), dist = +(params.get('dist') ?? 3.4);
    const TX = +(params.get('tx') ?? 0), TY = +(params.get('ty') ?? 0.85);
    function place() {
      const k = Math.cos(pitch);
      camera.position.set(TX + Math.sin(yaw) * k * dist, TY + Math.sin(pitch) * dist, Math.cos(yaw) * k * dist);
      camera.lookAt(TX, TY, 0);
    }
    let drag = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      yaw -= (e.clientX - drag[0]) * 0.008;
      pitch = Math.max(-0.3, Math.min(1.2, pitch + (e.clientY - drag[1]) * 0.008));
      drag = [e.clientX, e.clientY];
    });
    addEventListener('pointerup', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => { dist = Math.max(0.6, Math.min(8, dist * (1 + e.deltaY * 0.001))); }, { passive: true });
    for (const b of document.querySelectorAll('[data-v]')) b.onclick = () => { yaw = +b.dataset.v; };
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      for (const r of radios) { r.setTuned(tunedAt(r.dial())); r.update(dt); }
      c.update(dt, 0);
      place();
      renderer.render(scene, camera);
    });
    window.__radio = { radios, set: (o) => { if ('on' in o) on = o.on; if ('dial' in o) dialF = o.dial; apply(); } };
    window.__ready = true;
  </script>
</body>
</html>
