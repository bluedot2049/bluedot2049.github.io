<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渡海預覽</title>
<style>
  /* 渡海改版預覽：墨黑底、畫面中間一個圓，裡面全是按鈕那種金色細線。
     不浮現：第一幀就全在；每個循環有自己的相位 --p，第一幀落在循環中段，看不出起跑點。進度只看外圈金線 */
  :root { --ink: #120c08; --gold: #e8b86a; --gold-hi: #f6dba6; --gold-lo: #a9763a; --muted: #b5a084; }
  body { margin: 0; background: #241a13; color: #e8dcc8; font: 13px "Noto Serif TC", serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: #1c130d; border-bottom: 1px solid rgba(232,184,106,.2); }
  .bar button { font: inherit; color: var(--gold-hi); background: none; border: 1px solid var(--gold-lo); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .bar button.on { border-color: var(--gold); background: rgba(232,184,106,.14); }
  .bar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .frames { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px 16px; align-items: flex-start; }
  .frame { position: relative; container-type: size; overflow: hidden; outline: 1px solid rgba(232,184,106,.15); }
  .frame.portrait { width: 390px; height: 760px; }
  .frame.landscape { width: 760px; height: 390px; }
  .frame.wide { width: 1200px; height: 680px; }
  .tag { position: absolute; left: 8px; top: 6px; color: #5a4a3a; font-size: 11px; z-index: 1; }

  /* ───── 下面這段是要搬進 style.css 的 ───── */
  .sea {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--ink); --t: 0ms; --prog: 0;
  }
  .sea .frame-disc { position: relative; width: min(64cqmin, 420px); height: min(64cqmin, 420px); }
  .sea .disc { width: 100%; height: 100%; overflow: visible; }
  /* 外圈的金線照載入進度畫長。用 HTML 圓框加錐形遮罩：SVG 的虛線遇到 non-scaling-stroke 會改用螢幕像素算長度，大尺寸會斷 */
  .sea .frame-disc::after {
    content: ""; position: absolute; inset: 1.5%; border: 1px solid var(--gold); border-radius: 50%;
    -webkit-mask: conic-gradient(#000 calc(var(--prog) * 1%), transparent 0); mask: conic-gradient(#000 calc(var(--prog) * 1%), transparent 0);
  }
  .sea .msg { margin-top: 26px; padding-left: .4em; letter-spacing: .4em; color: rgba(232, 220, 200, .55); font-size: 14px; }
  .disc * { vector-effect: non-scaling-stroke; }
  .disc .ln { fill: none; stroke: var(--gold); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
  .disc .lo { stroke: var(--gold-lo); }
  .disc .faint { opacity: .45; }
  .disc .occ { fill: var(--ink); stroke: none; }
  .disc .lamp { fill: var(--gold-hi); }
  .disc .head { fill: var(--ink); stroke: var(--gold); stroke-width: 1; }
  .disc .gunwale { stroke-width: 1.4; }
  /* 外圈：底下一圈點線，上面金線照載入進度畫長 */
  .disc .ring-dots { fill: none; stroke: var(--gold-lo); stroke-width: 1; stroke-dasharray: .6 2.2; opacity: .7; }

  /* 海市外海的燈塔：全世界的海平線上都看得到它。跟 haishi.js 防波堤盡頭那座同一個樣子，每六秒閃兩下 */
  .disc .beacon { fill: var(--gold-hi); animation-name: beacon; animation-duration: 6s; animation-timing-function: linear; }
  .disc .beacon-glow { animation-name: beacon-glow; animation-duration: 6s; animation-timing-function: linear; }
  .disc .beacon-refl { opacity: .55; }

  /* 循環：delay = --t（已經過了多久，負的）+ 自己的相位 --p（負的）。週期互質，不會對齊同一拍 */
  .disc .loop { animation-delay: calc(var(--t) + var(--p, 0s)); animation-iteration-count: infinite; }
  .disc .bob { transform-box: view-box; transform-origin: 100px 200px; animation-name: bob; animation-duration: 5.3s; animation-timing-function: ease-in-out; }
  .disc .glow { animation-name: flicker; animation-duration: 3.7s; animation-timing-function: linear; }
  .disc .lamp { animation-name: flicker; animation-duration: 2.9s; animation-timing-function: linear; }
  .disc .shimmer { transform-box: view-box; transform-origin: 100px 104px; animation-name: shimmer; animation-duration: 3.1s; animation-timing-function: ease-in-out; animation-direction: alternate; }
  .disc .fog { fill: none; stroke: var(--gold-lo); stroke-width: 1; opacity: .4; animation-name: fog; animation-timing-function: linear; }
  .disc .fog.f1 { stroke-dasharray: 34 22 12 40 26 38; animation-duration: 41s; }
  .disc .fog.f2 { stroke-dasharray: 18 46 30 28 10 40; animation-duration: 29s; animation-direction: reverse; }
  .disc .wake { stroke: var(--gold-lo); stroke-width: 1; stroke-linecap: round; transform-box: view-box; transform-origin: 0 0; opacity: 0;
    animation-name: wake; animation-duration: var(--d, 5s); animation-timing-function: cubic-bezier(.55, 0, .9, .6); }

  @keyframes bob { 0%, 100% { transform: none; } 33% { transform: translateY(.4px) rotate(.45deg); } 70% { transform: translateY(-.3px) rotate(-.55deg); } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 18% { opacity: .8; } 22% { opacity: .95; } 61% { opacity: .85; } 70% { opacity: 1; } }
  @keyframes beacon { 0%, 3% { opacity: .35; } 5% { opacity: 1; } 7%, 13% { opacity: .35; } 15% { opacity: 1; } 17%, 100% { opacity: .35; } }
  @keyframes beacon-glow { 0%, 3% { opacity: 0; } 5% { opacity: 1; } 7%, 13% { opacity: 0; } 15% { opacity: 1; } 17%, 100% { opacity: 0; } }
  @keyframes shimmer { from { transform: scaleY(.84); } to { transform: scaleY(1.1); } }
  /* 虛線一個週期 172（每組 dasharray 加起來都是 172），走完剛好接回原點 */
  @keyframes fog { to { stroke-dashoffset: -172; } }
  @keyframes wake {
    0% { transform: translate(calc(var(--x) * 1px), 105px) scaleX(.25); opacity: 0; }
    20% { opacity: .9; }
    100% { transform: translate(calc((var(--x) + var(--dx)) * 1px), 200px) scaleX(3); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .disc .loop { animation: none; } .disc .wake { opacity: .5; } }
</style>
</head>
<body>
<div class="bar">
  <button data-to="haishi" class="on">往海市</button>
  <button data-to="gallery">回畫廊</button>
  <label>進度 <input id="prog" type="range" min="0" max="100" value="35"></label>
  <button id="auto">自動跑進度</button>
  <button id="restart">重新開頁（--t = 0，看第一拍）</button>
  <button id="resume">換頁接續（--t = −7.3s）</button>
</div>
<div class="frames">
  <div class="frame portrait"><span class="tag">手機直式 390×760</span></div>
  <div class="frame landscape"><span class="tag">手機橫式 760×390</span></div>
  <div class="frame wide"><span class="tag">桌機 1200×680</span></div>
</div>

<template id="scene">
  <div class="sea to-haishi">
    <div class="frame-disc"><svg class="disc" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <clipPath id="disc-clip"><circle cx="100" cy="100" r="94"/></clipPath>
        <radialGradient id="disc-glow"><stop offset="0" stop-color="#f6dba6" stop-opacity=".42"/><stop offset=".35" stop-color="#e8b86a" stop-opacity=".12"/><stop offset="1" stop-color="#e8b86a" stop-opacity="0"/></radialGradient>
      </defs>
      <circle class="ring-dots" cx="100" cy="100" r="97"/>
      <g clip-path="url(#disc-clip)"><g transform="translate(100 118) scale(1.7) translate(-100 -118)">
        <!-- 海平線 -->
        <path class="ln" d="M0 104H200"/>
        <!-- 燈塔：礁石上一座往上收的塔，兩道環、燈廊、燈室、尖頂；水面拉一道會晃的倒影，閃的時候跟著亮 -->
        <g class="lighthouse">
          <circle class="beacon-glow loop" style="--p:-4.2s" cx="128" cy="91.5" r="8" fill="url(#disc-glow)"/>
          <path class="ln lo" d="M122.5 104Q125 102.8 128 102.9Q131 102.8 133.5 104"/>
          <path class="ln" d="M125.8 103.4L126.8 92.4M130.2 103.4L129.2 92.4M125.4 92.4H130.6M126.9 92.4V90.6M129.1 92.4V90.6M126.3 90.6L128 88.4L129.7 90.6Z"/>
          <path class="ln lo" d="M126 101.6H130M126.1 100.4H129.9M126.4 97.6H129.6M126.5 96.4H129.5"/>
          <circle class="beacon loop" style="--p:-4.2s" cx="128" cy="91.5" r=".55"/>
          <g class="shimmer loop" style="--p:-1.9s"><g class="beacon-refl"><path class="ln lo beacon loop" style="--p:-4.2s" stroke-dasharray="1.4 1.8" d="M128 106V117"/></g></g>
        </g>
        <!-- 霧：兩條很淡的長虛線，往兩個方向慢慢流 -->
        <path class="fog f1 loop" style="--p:-13.4s" d="M0 98.5H200"/>
        <path class="fog f2 loop" style="--p:-7.1s" d="M0 101.6H200"/>
        <!-- 水面的波紋：從海平線冒出來往兩旁散、拉長，流出圓外。每條相位都不一樣 -->
        <g class="wakes">
          <line class="wake loop" x1="-3" x2="3" style="--x:84;--dx:-62;--p:-0.4s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:76;--dx:-80;--p:-2.9s;--d:5.6s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:90;--dx:-44;--p:-4.1s;--d:6.1s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:66;--dx:-90;--p:-1.6s;--d:5.3s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:95;--dx:-30;--p:-3.4s;--d:4.7s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:116;--dx:62;--p:-1.1s;--d:5.4s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:124;--dx:82;--p:-3.8s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:108;--dx:40;--p:-2.2s;--d:6.3s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:134;--dx:88;--p:-4.6s;--d:5.8s"/>
          <line class="wake loop" x1="-3" x2="3" style="--x:104;--dx:28;--p:-0.8s;--d:4.9s"/>
        </g>
        <!-- 坐在船上往前看：兩邊船舷往船頭收，船頭天鵝頸，黑袍船夫背對著站在船頭提燈（跟 harbor.js 的渡船同一艘） -->
        <g class="bob loop" style="--p:-2.6s">
          <path class="occ" d="M-44 183.8Q16 145.4 98.2 127.4L101.8 127.4Q184 145.4 244 183.8V210H-44Z"/>
          <path class="ln lo faint" d="M38 200L98.8 129.8M100 200V129.8M162 200L101.2 129.8"/>
          <path class="occ" d="M32.8 147.8H167.2L170.8 153.2H29.2Z"/>
          <path class="ln lo" d="M32.8 147.8H167.2M29.2 153.2H170.8"/>
          <path class="ln lo" d="M-40 181.4Q16 146.6 88 129.8M240 181.4Q184 146.6 112 129.8"/>
          <path class="ln gunwale" d="M-44 183.8Q16 145.4 98.2 127.4M244 183.8Q184 145.4 101.8 127.4"/>
          <path class="ln" d="M100 128.3C102.1 122.9 101.5 116.9 99.4 113.9C97.9 111.5 98.5 109.1 100.3 108.2"/>
          <circle class="head" cx="100.45" cy="107.75" r="1"/>
          <path class="ln" d="M101.1 107.1L102.2 105.9"/>
          <circle class="glow loop" style="--p:-1.3s" cx="87.6" cy="85.5" r="22" fill="url(#disc-glow)"/>
          <!-- 船夫：袍子裡面填墨色，把後面的海平線和船舷擋掉；燈那一側的袍邊是亮金，另一側暗金 -->
          <path class="occ" d="M66 139.9C67.3 130 68.3 118.2 69.6 110.2C69.9 106.9 70.6 104.3 71.9 102.3C72.6 99.7 73.5 97.4 74.9 95.1C75.9 98 76.8 100.7 77.5 103C78.5 105 79.2 107.6 79.2 110.9C80.1 118.8 81.1 130 82.5 139.9Z"/>
          <path class="ln lo" d="M66 139.9C67.3 130 68.3 118.2 69.6 110.2C69.9 106.9 70.6 104.3 71.9 102.3C72.6 99.7 73.5 97.4 74.9 95.1M66 139.9H82.5"/>
          <path class="ln" d="M74.9 95.1C75.9 98 76.8 100.7 77.5 103C78.5 105 79.2 107.6 79.2 110.9C80.1 118.8 81.1 130 82.5 139.9"/>
          <path class="ln" d="M78.2 112.2Q82.1 114.9 86.4 113.5"/>
          <path class="ln" d="M86.4 141.3L87.4 87.4M86.1 82.6H89.1"/>
          <rect class="lamp loop" style="--p:-0.7s" x="86.6" y="83.3" width="2" height="3.4" rx=".5"/>
        </g>
      </g></g>
    </svg></div>
    <div class="msg">渡海　往海市</div>
  </div>
</template>

<script>

  let to = location.hash === "#g" ? "gallery" : "haishi", prog = 35, t = 0, timer = null;
  function build() {
    for (const fr of document.querySelectorAll('.frame')) {
      fr.querySelector('.sea')?.remove();
      const s = document.getElementById('scene').content.firstElementChild.cloneNode(true);
      // 每個框的 clipPath / 漸層要有自己的 id，不然三個框會互相參照
      const k = [...fr.parentNode.children].indexOf(fr);
      s.innerHTML = s.innerHTML.replaceAll('disc-clip', 'disc-clip' + k).replaceAll('disc-glow', 'disc-glow' + k);
      s.className = 'sea to-' + to;
      s.style.setProperty('--t', t + 'ms');
      s.style.setProperty('--prog', prog);
      s.querySelector('.msg').textContent = to === 'haishi' ? '渡海　往海市' : '渡海　回畫廊';
      fr.appendChild(s);
    }
  }
  const setProg = (v) => { prog = v; document.getElementById('prog').value = v; for (const s of document.querySelectorAll('.sea')) s.style.setProperty('--prog', v); };
  for (const b of document.querySelectorAll('[data-to]')) b.onclick = () => {
    to = b.dataset.to; for (const o of document.querySelectorAll('[data-to]')) o.classList.toggle('on', o === b); build();
  };
  document.getElementById('prog').oninput = (e) => setProg(+e.target.value);
  document.getElementById('restart').onclick = () => { t = 0; build(); };
  document.getElementById('resume').onclick = () => { t = -7300; build(); };
  document.getElementById('auto').onclick = () => {
    clearInterval(timer); setProg(0); t = 0; build();
    timer = setInterval(() => { setProg(Math.min(100, prog + 2 + Math.random() * 5)); if (prog >= 100) clearInterval(timer); }, 400);
  };
  build();
</script>
</body>
</html>
