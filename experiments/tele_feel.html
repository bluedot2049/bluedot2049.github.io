<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>長焦手感</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141210; color: #e9e0cc; font-family: "Noto Serif TC", serif; overflow: hidden; }
    canvas { position: absolute; display: block; touch-action: none; }
    .note { position: fixed; top: 10px; left: 14px; font-size: 13px; opacity: 0.7; line-height: 1.6; pointer-events: none; }
    .mm { position: fixed; top: 10px; right: 14px; font: 600 20px/1 ui-monospace, monospace; }
    .env { position: fixed; top: 38px; right: 14px; width: 120px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    .env i { display: block; height: 100%; background: #e9b86a; width: 0; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,0.65)); font-size: 13px; }
    .panel label { display: flex; gap: 6px; align-items: center; }
    .panel input[type=range] { width: 90px; }
    .panel button { padding: 7px 12px; border: 1px solid #5a4e3e; border-radius: 6px; background: #2a241e; color: inherit; font: inherit; cursor: pointer; }
    .strip { position: fixed; top: 60px; right: 14px; display: flex; flex-direction: column; gap: 6px; }
    .strip img { width: 120px; border: 1px solid #555; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div class="note">拖曳轉方向　滾輪或 + − 變焦（電動，等速）<br>R 重新舉起　空白鍵拍一張（右邊排著看晃到什麼程度）</div>
  <div class="mm" id="mm"></div>
  <div class="env"><i id="env"></i></div>
  <div class="strip" id="strip"></div>
  <div class="panel">
    <button id="raise">重新舉起</button>
    <button id="shoot">拍</button>
    <label>收穩 <input data-k="settle" type="range" min="0.3" max="4" step="0.1"><span></span></label>
    <label>穩多久 <input data-k="calm" type="range" min="0.5" max="6" step="0.1"><span></span></label>
    <label>一輪 <input data-k="period" type="range" min="2" max="12" step="0.1"><span></span></label>
    <label>再晃幾成 <input data-k="peak" type="range" min="0.1" max="1" step="0.05"><span></span></label>
    <label>穩時剩 <input data-k="floor" type="range" min="0" max="0.3" step="0.01"><span></span></label>
    <label>幅度 <input data-k="amp" type="range" min="0.002" max="0.03" step="0.001"><span></span></label>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { SWAY, sway, swayEnv } from '../js/camera/sway.js';
    import { longTan } from '../js/camera/cameras.js';

    const S = { ...SWAY };
    const MM0 = 35, MM1 = 85, SPEED = (MM1 - MM0) / 1;   // 電動：全程約 1 秒，等速
    const ASPECT = 3 / 2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.prepend(renderer.domElement);

    // 沙地、遠山，每隔一段距離站一個人、一根標竿
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe7cfa6);
    scene.fog = new THREE.Fog(0xe7cfa6, 60, 260);
    scene.add(new THREE.HemisphereLight(0xfff3dc, 0x8a6a48, 1.5));
    const sun = new THREE.DirectionalLight(0xffe2b8, 1.6);
    sun.position.set(-3, 5, 2);
    scene.add(sun);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshLambertMaterial({ color: 0xc9a36e }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    const R = (() => { let a = 7; return () => ((a = (a * 16807) % 2147483647) / 2147483647); })();
    for (let i = 0; i < 40; i++) {
      const r = 6 + R() * 18, m = new THREE.Mesh(new THREE.ConeGeometry(r, r * (0.3 + R() * 0.4), 6), new THREE.MeshLambertMaterial({ color: 0xb58a5a, flatShading: true }));
      const a = R() * Math.PI * 2, d = 180 + R() * 120;
      m.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
      scene.add(m);
    }
    const COLORS = [0x7a3b2e, 0x2f4858, 0x588b8b, 0x8e5572, 0x3d5a40, 0xd4b483];
    const walkers = [];
    [10, 18, 30, 50, 80, 130].forEach((d, i) => {
      const a = -0.5 + i * 0.2, x = Math.sin(a) * d, z = -Math.cos(a) * d;
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 1.2, 8), new THREE.MeshLambertMaterial({ color: COLORS[i], flatShading: true }));
      body.position.y = 0.6;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), new THREE.MeshLambertMaterial({ color: 0xe8c9a8, flatShading: true }));
      head.position.y = 1.42;
      g.add(body, head);
      g.position.set(x, 0, z);
      scene.add(g);
      walkers.push({ g, x, z, ph: i * 1.7 });
      const pole = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.4, 0.08), new THREE.MeshLambertMaterial({ color: i % 2 ? 0xf0ece4 : 0x2a2622 }));
      pole.position.set(x + 1.2, 1.2, z);
      scene.add(pole);
    });

    const camera = new THREE.PerspectiveCamera(40, ASPECT, 0.1, 600);
    camera.position.set(0, 1.55, 0);
    camera.rotation.order = 'YXZ';
    let yaw = 0, pitch = -0.02, mm = MM0, goal = MM0, t = 0;

    // 3:2 畫面置中塞滿視窗
    function fit() {
      let w = innerWidth, h = w / ASPECT;
      if (h > innerHeight) { h = innerHeight; w = h * ASPECT; }
      renderer.setSize(w, h);
      Object.assign(renderer.domElement.style, { left: (innerWidth - w) / 2 + 'px', top: (innerHeight - h) / 2 + 'px' });
    }
    fit();
    addEventListener('resize', fit);

    // 馬達聲：鋸齒波過低通，跑的時候才出聲
    let audio = null;
    function motor(on) {
      if (!audio) {
        const ac = new AudioContext(), o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'sawtooth'; o.frequency.value = 210; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0;
        o.connect(f).connect(g).connect(ac.destination); o.start();
        audio = { ac, g, o };
      }
      audio.g.gain.setTargetAtTime(on ? 0.035 : 0, audio.ac.currentTime, 0.02);
    }

    const zoomBy = (d) => { goal = Math.max(MM0, Math.min(MM1, goal + d)); };
    addEventListener('wheel', (e) => zoomBy(e.deltaY < 0 ? 4 : -4), { passive: true });
    const held = new Set();
    addEventListener('keydown', (e) => {
      if (e.key === '+' || e.key === '=') held.add(1);
      else if (e.key === '-' || e.key === '_') held.add(-1);
      else if (e.key === 'r' || e.key === 'R') t = 0;
      else if (e.key === ' ') { e.preventDefault(); shoot(); }
    });
    addEventListener('keyup', (e) => { held.delete(1); held.delete(-1); });
    let drag = null;
    addEventListener('pointerdown', (e) => { if (e.target === renderer.domElement) drag = [e.clientX, e.clientY]; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      const k = 0.0025 * longTan(mm);
      yaw -= (e.clientX - drag[0]) * k;
      pitch = Math.max(-0.6, Math.min(0.6, pitch - (e.clientY - drag[1]) * k));
      drag = [e.clientX, e.clientY];
    });
    addEventListener('pointerup', () => { drag = null; });
    document.getElementById('raise').onclick = () => { t = 0; };
    document.getElementById('shoot').onclick = () => shoot();

    for (const input of document.querySelectorAll('[data-k]')) {
      const k = input.dataset.k, out = input.nextElementSibling;
      input.value = S[k];
      const show = () => { S[k] = +input.value; out.textContent = (+input.value).toFixed(k === 'amp' ? 3 : 2); };
      input.oninput = show;
      show();
    }

    const strip = document.getElementById('strip');
    function shoot() {
      const img = new Image();
      img.src = renderer.domElement.toDataURL('image/jpeg', 0.8);
      strip.prepend(img);
      while (strip.children.length > 5) strip.lastChild.remove();
    }

    const off = { x: 0, y: 0 }, mmEl = document.getElementById('mm'), envEl = document.getElementById('env');
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      t += dt;
      for (const d of held) zoomBy(d * SPEED * dt);
      const step = Math.sign(goal - mm) * Math.min(Math.abs(goal - mm), SPEED * dt);
      mm += step;
      if (navigator.userActivation?.hasBeenActive) motor(Math.abs(step) > 1e-4);
      // 人慢慢走來走去，看追得住嗎
      for (const w of walkers) w.g.position.x = w.x + Math.sin(clock.elapsedTime * 0.4 + w.ph) * 1.5;
      sway(t, mm, S, off);
      camera.fov = 2 * Math.atan(longTan(mm) / ASPECT) * 180 / Math.PI;
      camera.updateProjectionMatrix();
      camera.rotation.set(pitch + off.y, yaw + off.x, 0);
      renderer.render(scene, camera);
      mmEl.textContent = Math.round(mm) + 'mm';
      envEl.style.width = (swayEnv(t, S) * 100).toFixed(0) + '%';
    });
  </script>
</body>
</html>
